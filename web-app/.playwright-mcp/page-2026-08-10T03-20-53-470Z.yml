    - main [ref=f1e47]:
      - generic [ref=f1e48]: General
      - generic [ref=f1e49]:
        - button "What is YouCam Online Editor?" [ref=f1e50] [cursor=pointer]
        - region:
          - generic [ref=f1e53]: YouCam Online Editor is a powerful all-in-one AI photo enhancer and upscaler that lets you transform photos, fix old or blurry images, remove backgrounds, erase objects, create HD images, and much more. Sharpen, unblur, and upscale images with the power of AI — all directly in your browser with no software installation required.
      - generic [ref=f1e54]:
        - button "Is YouCam Online Editor free?" [ref=f1e55] [cursor=pointer]
        - region:
          - generic [ref=f1e58]: YouCam Online Editor offers a free tier with access to core editing tools. For advanced AI features, higher resolution exports, and commercial use, you can upgrade to a Pro or Plus subscription, or purchase pay-as-you-go credits.
      - generic [ref=f1e59]:
        - button "Can I use YouCam Online Editor for commercial purposes?" [ref=f1e60] [cursor=pointer]
        - region:
          - generic [ref=f1e63]:
            - text: Commercial use is only allowed for Pro subscribers and for images generated using API units. For more information, please refer to our
            - link "Terms of Service" [ref=f1e64] [cursor=pointer]:
              - /url: "#"
            - text: .
      - generic [ref=f1e65]:
        - button "What kind of images can I use with YouCam Online Editor?" [ref=f1e66] [cursor=pointer]
        - region:
          - generic [ref=f1e69]: YouCam Online Editor supports JPEG, PNG, HEIC, and WebP formats. For best results, use images under 20 MB. Very low resolution images (under 100 × 100 px) may produce limited results with AI enhancement tools.
      - generic [ref=f1e70]:
        - button "I would like to understand more about the privacy of my photos. Does Perfect Corp. have access to the photos?" [ref=f1e71] [cursor=pointer]
        - region:
          - generic [ref=f1e74]:
            - text: Your privacy is important to us. Photos you upload are processed solely to provide the requested AI feature and are not used for advertising or shared with third parties. Please review our
            - link "Privacy Policy" [ref=f1e75] [cursor=pointer]:
              - /url: "#"
            - text: for full details on data handling and retention.
      - generic [ref=f1e76]: Credits & Billing
      - generic [ref=f1e77]:
        - button "What is credit?" [ref=f1e78] [cursor=pointer]
        - region:
          - generic [ref=f1e81]: Credits are the in-app currency used to run AI features such as photo enhancement, background removal, and image generation. Each action consumes a set number of credits depending on complexity. You can earn credits through your subscription plan or purchase them separately.
      - generic [ref=f1e82]:
        - button "What's the difference between credits and units?" [ref=f1e83] [cursor=pointer]
        - region:
          - generic [ref=f1e86]: Credits are used within the YouCam Online Editor web product. API units are exclusively for API access and cannot be used in the web editor. Purchasing a Pro or Plus plan, or buying credits, does not grant API access.
      - generic [ref=f1e87]:
        - button "What's the difference between Pay as you go credits and Subscription?" [ref=f1e88] [cursor=pointer]
        - region:
          - generic [ref=f1e91]: A subscription gives you a recurring allocation of credits each billing cycle and access to premium features at a lower per-use cost. Pay-as-you-go credits never expire and are ideal for occasional use — you purchase only what you need, with no monthly commitment.
      - generic [ref=f1e92]:
        - button "What is the supported payment method?" [ref=f1e93] [cursor=pointer]
        - region:
          - generic [ref=f1e96]: We accept all major credit and debit cards (Visa, Mastercard, American Express), as well as PayPal. Payment processing is handled securely through our payment provider.
      - generic [ref=f1e97]: Subscription Management
      - generic [ref=f1e98]:
        - button "What's the AI Avatar pack plan?" [ref=f1e99] [cursor=pointer]
        - region:
          - generic [ref=f1e102]: The AI Avatar pack is an add-on that lets you generate a full set of professional-style AI avatars from your selfies. It is available as a one-time purchase and does not require a subscription. Generated avatars can be downloaded in high resolution.
      - generic [ref=f1e103]:
        - button "What will happen if the subscription plan is upgraded?" [ref=f1e104] [cursor=pointer]
        - region:
          - generic [ref=f1e107]: When you upgrade your plan, the new plan takes effect immediately. Any unused credits from your previous plan are forfeited, and you will receive the full credit allocation of your new plan. The price difference is prorated for the remaining billing period.
      - generic [ref=f1e108]:
        - button "How can I change my subscription plan for YouCam Online Editor?" [ref=f1e109] [cursor=pointer]
        - region:
          - generic [ref=f1e112]:
            - text: To change your plan, go to
            - link "Account → My Plan" [ref=f1e113] [cursor=pointer]:
              - /url: "#"
            - text: and select the plan you'd like to switch to. Changes to a higher tier take effect immediately; downgrades take effect at the end of the current billing cycle.
      - generic [ref=f1e114]:
        - button "How do I cancel my subscription?" [ref=f1e115] [cursor=pointer]
        - region:
          - generic [ref=f1e118]:
            - text: You can cancel at any time from
            - link "Account → My Plan → Cancel Plan" [ref=f1e119] [cursor=pointer]:
              - /url: "#"
            - text: . After cancellation, you retain access to your current plan's features until the end of the billing period. No further charges will be made.
      - generic [ref=f1e120]:
        - button "Can I request a refund for YouCam Online Editor?" [ref=f1e121] [cursor=pointer]
        - region:
          - generic [ref=f1e124]:
            - text: Refund requests can be submitted within 14 days of purchase via
            - link "Account → Billing → Purchase history" [ref=f1e125] [cursor=pointer]:
              - /url: "#"
            - text: . Select the order and click
            - strong [ref=f1e126]: Request refund
            - text: . If the option is not available, please contact our support team with your Order ID.
      - generic [ref=f1e127]:
        - button "Can I transfer my subscription between YouCam Online Editor and YouCam Enhance app?" [ref=f1e128] [cursor=pointer]
        - region:
          - generic [ref=f1e131]: Subscriptions are currently tied to the platform they were purchased on and cannot be transferred between YouCam Online Editor and the YouCam Enhance mobile app. Each platform manages its own billing independently.
      - generic [ref=f1e132]: How Can I Remove the Watermark?
      - generic [ref=f1e133]:
        - button "How can I remove the watermark?" [ref=f1e134] [cursor=pointer]
        - region:
          - generic [ref=f1e137]: Watermarks are removed automatically when you are on a paid plan (Plus or Pro). If you are on a paid plan and still see a watermark, try signing out and signing back in to refresh your plan status, then attempt the export again.
      - generic [ref=f1e138]: Technical
      - generic [ref=f1e139]:
        - button "How does enhancement affect the resolution of my image?" [ref=f1e140] [cursor=pointer]
        - region:
          - generic [ref=f1e143]: AI enhancement can upscale your image by up to 4×, reconstructing fine detail using machine learning. The output resolution depends on your subscription plan — free users receive standard output, while Pro users get full 4× upscaling with maximum detail recovery.
      - generic [ref=f1e144]:
        - button "How can I solve this error, \"Oops! Might be user input unsupported format, server issue or other unknown issue\"?" [ref=f1e145] [cursor=pointer]
        - region:
          - generic [ref=f1e148]: "This error usually means the file format or size is not supported. Try: (1) converting your image to JPG or PNG, (2) reducing the file size to under 20 MB, (3) doing a hard reload (Cmd/Ctrl + Shift + R), and (4) trying a different browser. If the error persists, contact support with the file details."
      - generic [ref=f1e149]:
        - button "After clicking the share link why do I see the message, \"Invalid link — The link has either expired or is incorrect\"?" [ref=f1e150] [cursor=pointer]
        - region:
          - generic [ref=f1e153]: Share links expire after 30 days or if the original image is deleted from your account. To share again, re-upload or re-generate the image and create a new share link from the result page.
      - generic [ref=f1e154]: Account
      - generic [ref=f1e155]:
        - button "How do I migrate my old Facebook account to the new registered one?" [ref=f1e156] [cursor=pointer]
        - region:
          - generic [ref=f1e159]: We apologize for the technical issue with Facebook Connect login. To migrate, please contact our support team with your old Facebook-linked email and the email of your new account. Our team will manually transfer your credits and subscription status within 2–3 business days.
      - generic [ref=f1e160]:
        - button "I can't log in with my login details" [ref=f1e161] [cursor=pointer]
        - region:
          - generic [ref=f1e164]:
            - text: First, try resetting your password via the
            - link "Forgot password" [ref=f1e165] [cursor=pointer]:
              - /url: "#"
            - text: link on the sign-in page. If you signed up with a social login (Google, Facebook, Apple), use that same method — a password may not have been set. Still stuck? Contact support and we'll help you regain access.
      - generic [ref=f1e166]:
        - button "How can I change my YouCam Online Editor account password?" [ref=f1e167] [cursor=pointer]
        - region:
          - generic [ref=f1e170]:
            - text: Go to
            - link "Account → Settings → Change password" [ref=f1e171] [cursor=pointer]:
              - /url: "#"
            - text: . You'll need to confirm your current password before setting a new one. If you signed up via social login, a password has not been set — you can add one from the same settings page.
      - generic [ref=f1e172]:
        - button "How can I delete my account?" [ref=f1e173] [cursor=pointer]
        - region:
          - generic [ref=f1e176]:
            - text: Before deleting your account, cancel any active subscription at
            - link "My Plan" [ref=f1e177] [cursor=pointer]:
              - /url: "#"
            - text: to avoid future charges. Download any creations you want to keep from
            - link "My Creations" [ref=f1e178] [cursor=pointer]:
              - /url: "#"
            - text: . Then go to
            - link "Account → Settings → Delete account" [ref=f1e179] [cursor=pointer]:
              - /url: "#"
            - text: and confirm. Deletion is permanent and removes all data within 30 days.
      - generic [ref=f1e180]:
        - button "How to contact us?" [ref=f1e181] [cursor=pointer]
        - region:
          - generic [ref=f1e184]:
            - text: You can reach our support team by clicking
            - strong [ref=f1e185]: Contact Support
            - text: in the footer, or by using the chat widget on this page. Our team typically replies by email.
