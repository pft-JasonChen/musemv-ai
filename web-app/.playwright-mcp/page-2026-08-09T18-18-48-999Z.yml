      - generic [ref=f1e1717]:
        - generic [ref=f1e1718]:
          - generic [ref=f1e1719]: ✓
          - text: Design Decisions — reference index
        - paragraph [ref=f1e1720]: Each decision also appears inline beside the step it governs; this is the recap. Follow the ↩ link to jump to the first step that relies on it.
        - table [ref=f1e1722]:
          - rowgroup [ref=f1e1723]:
            - row [ref=f1e1724]:
              - columnheader "ID" [ref=f1e1725]
              - columnheader "Question" [ref=f1e1726]
              - columnheader "Decision" [ref=f1e1727]
          - rowgroup [ref=f1e1728]:
            - row [ref=f1e1729]:
              - cell "D-01" [ref=f1e1730]
              - cell "How is the widget opened?" [ref=f1e1731]
              - 'cell "Two entry points: the profile dropdown “Support” item (site-wide), and a support icon on the FAQ page only. Both open the same panel." [ref=f1e1732]'
            - row [ref=f1e1733]:
              - cell "D-02" [ref=f1e1734]
              - cell "How is LLM cost controlled?" [ref=f1e1735]
              - cell [ref=f1e1736]:
                - text: Home shows canned buttons only with the free-text input hidden, so the paid LLM is not called until the user opts in.
                - link "↩ P1-S3" [ref=f1e1737] [cursor=pointer]:
                  - /url: "#P1-S3"
            - row [ref=f1e1738]:
              - cell "D-03" [ref=f1e1739]
              - cell "Where does “None of above” appear?" [ref=f1e1740]
              - cell [ref=f1e1741]:
                - text: At Layer 1 (after the six Popular questions) and after each topic’s follow-ups. There is no feedback chip at the default level.
                - link "↩ P1-S3" [ref=f1e1742] [cursor=pointer]:
                  - /url: "#P1-S3"
            - row [ref=f1e1743]:
              - cell "D-04" [ref=f1e1744]
              - cell "Do canned buttons persist?" [ref=f1e1745]
              - cell [ref=f1e1746]:
                - text: Yes — a clicked button becomes disabled; others stay clickable and replies append. Invoking the LLM or a ticket disables all of them. New chat resets.
                - link "↩ P1-S6" [ref=f1e1747] [cursor=pointer]:
                  - /url: "#P1-S6"
            - row [ref=f1e1748]:
              - cell "D-05" [ref=f1e1749]
              - cell "What opens the free-text LLM input, and how does the user know?" [ref=f1e1750]
              - cell [ref=f1e1751]:
                - text: "Only two triggers: tapping “None of above”, or “No” on a follow-up answer. The two feedback prompts differ so the outcome is legible: a canned answer shows “Does this solution meet your needs?” (No opens the input); an AI reply shows “Did this help?” (No, still stuck opens the ticket)."
                - link "↩ P1-S5" [ref=f1e1752] [cursor=pointer]:
                  - /url: "#P1-S5"
            - row [ref=f1e1753]:
              - cell "D-06" [ref=f1e1754]
              - cell "How is a ticket offered?" [ref=f1e1755]
              - cell [ref=f1e1756]:
                - text: "Per BD chatbot_spec_v2: the only direct-ticket follow-up is Refund “My Order ID / Invoice has letters and numbers” (Stripe). Every other follow-up routes through the feedback chip to the LLM, and the AI reply’s “No” then opens the ticket. Single CTA, no “Keep trying”."
                - link "↩ P2-S3" [ref=f1e1757] [cursor=pointer]:
                  - /url: "#P2-S3"
            - row [ref=f1e1758]:
              - cell "D-07" [ref=f1e1759]
              - cell "Ticket Type options and backend mapping?" [ref=f1e1760]
              - cell [ref=f1e1761]:
                - text: "Four types, each mapped to a CSB questionTypeId: Purchase and Payment (313) / Account (348) / Feature Issue (204) / Others (211). Placeholder “Select an issue type”, no pre-selection. The form is flat — no type-conditional fields."
                - link "↩ P2-S4" [ref=f1e1762] [cursor=pointer]:
                  - /url: "#P2-S4"
            - row [ref=f1e1763]:
              - cell "D-08" [ref=f1e1764]
              - cell "What are the upload limits?" [ref=f1e1765]
              - cell [ref=f1e1766]:
                - text: "Chat: images only (JPG/PNG/WebP/HEIC), 5 MB per message and 50 MB per chat. The 50 MB budget counts bytes actually sent and is reset by New chat. Ticket: any file type, any number of files, 10 MB across all of them. The two budgets are independent."
                - link "↩ P2-S2" [ref=f1e1767] [cursor=pointer]:
                  - /url: "#P2-S2"
            - row [ref=f1e1768]:
              - cell "D-09" [ref=f1e1769]
              - cell "How are Subject and Description pre-filled?" [ref=f1e1770]
              - cell [ref=f1e1771]:
                - text: "Both are agent-supplied on the LLM path: Subject = a short AI title, Description = the full AI summary; both editable. On a direct ticket with no LLM turn they open empty. There is no minimum-length rule."
                - link "↩ P2-S4" [ref=f1e1772] [cursor=pointer]:
                  - /url: "#P2-S4"
            - row [ref=f1e1773]:
              - cell "D-10" [ref=f1e1774]
              - cell "What does “resolved” look like?" [ref=f1e1775]
              - cell "A resolved message with no action buttons; no “Anything else?” re-show." [ref=f1e1776]
            - row [ref=f1e1777]:
              - cell "D-12" [ref=f1e1778]
              - cell "What does the client send to the CSB backend?" [ref=f1e1779]
              - cell [ref=f1e1780]:
                - text: "Visible: Email, Type, Subject, Order ID and Description. Hidden/auto: product (prodVerId=504), UI language, packaged chat history. User ID, Order ID and Description are concatenated into the backend q field, each with a label. Full mapping:"
                - link "T3" [ref=f1e1781] [cursor=pointer]:
                  - /url: "#T3"
                - text: .
            - row [ref=f1e1782]:
              - cell "D-13" [ref=f1e1783]
              - cell "Where do the canned strings come from?" [ref=f1e1784]
              - cell [ref=f1e1785]:
                - text: The CMS. The greeting, the six topic labels, every default answer and every follow-up label and answer are CMS content read at runtime (
                - link "T2" [ref=f1e1786] [cursor=pointer]:
                  - /url: "#T2"
                - text: ). UI chrome — “None of above”, the feedback prompts, error copy and the ticket form labels — stays in the frontend string bundle. A question whose answer could not be edited alongside it would drift.
                - link "↩ P1-S3" [ref=f1e1787] [cursor=pointer]:
                  - /url: "#P1-S3"
            - row [ref=f1e1788]:
              - cell "D-14" [ref=f1e1789]
              - cell "What happens when the CMS content cannot be loaded?" [ref=f1e1790]
              - cell [ref=f1e1791]:
                - text: Skeleton rows while it loads; on failure an inline error with Retry (
                - link "P1-E1" [ref=f1e1792] [cursor=pointer]:
                  - /url: "#P1-E1"
                - text: ); if Retry fails too, the free-text input is revealed (
                - link "P1-E2" [ref=f1e1793] [cursor=pointer]:
                  - /url: "#P1-E2"
                - text: ). The cost guard yields rather than leaving the user with a panel that can do nothing.
                - link "↩ P1-E2" [ref=f1e1794] [cursor=pointer]:
                  - /url: "#P1-E2"
            - row [ref=f1e1795]:
              - cell "D-15" [ref=f1e1796]
              - cell "How many feedback chips can be on screen?" [ref=f1e1797]
              - cell [ref=f1e1798]:
                - text: Exactly one. Any new user turn — another topic, another follow-up, “None of above”, or a typed message — removes the pending chip, so the chip always refers to the newest answer. An answered chip is removed as before.
                - link "↩ P1-S10" [ref=f1e1799] [cursor=pointer]:
                  - /url: "#P1-S10"
            - row [ref=f1e1800]:
              - cell "D-16" [ref=f1e1801]
              - cell "What Markdown must the chat render?" [ref=f1e1802]
              - cell [ref=f1e1803]:
                - text: Bold, italic, ordered lists, unordered lists, links, paragraphs and two-space line breaks — from the CX Agent and from the CMS alike. Everything else renders as literal text. Raw HTML is escaped rather than executed, only http and https links are made clickable, and every link opens in a new tab. The supported set is tabulated on
                - link "P2-S2" [ref=f1e1804] [cursor=pointer]:
                  - /url: "#P2-S2"
                - text: .
                - link "↩ P2-S2" [ref=f1e1805] [cursor=pointer]:
                  - /url: "#P2-S2"
            - row [ref=f1e1806]:
              - cell "D-17" [ref=f1e1807]
              - cell "Where do upload errors appear?" [ref=f1e1808]
              - cell [ref=f1e1809]:
                - text: "In place: chat upload errors render inside the input field above the thumbnails; ticket attachment errors render under the attachment field inside the form. No toasts — a message about a file belongs where the file was attached."
                - link "↩ P2-E1" [ref=f1e1810] [cursor=pointer]:
                  - /url: "#P2-E1"
            - row [ref=f1e1811]:
              - cell "D-18" [ref=f1e1812]
              - cell "What is the Order ID field asking for?" [ref=f1e1813]
              - cell [ref=f1e1814]:
                - text: The order or invoice ID that 2Checkout or Stripe printed on the user’s receipt email, so the user can match it to their own purchase. The hint names both providers. Whether the frontend can pre-fill it is Q-03.
                - link "↩ P2-S4" [ref=f1e1815] [cursor=pointer]:
