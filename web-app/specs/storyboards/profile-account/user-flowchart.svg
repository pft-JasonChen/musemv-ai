<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1200" viewBox="0 0 1180 1200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" role="img">
<title>Profile, Account &amp; Settings &#8212; User Flowchart</title>
<defs><marker id="fc-primary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#5a6b78" stroke-width="1.5"/></marker><marker id="fc-error" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#d6484a" stroke-width="1.5"/></marker><marker id="fc-structural" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#a8b2ba" stroke-width="1.5"/></marker><marker id="fc-deferred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#a8b2ba" stroke-width="1.5"/></marker><marker id="fc-retry" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#6cc7e6" stroke-width="1.5"/></marker></defs>
<rect width="1180" height="1200" fill="#ffffff"/>
<text x="40" y="30" font-size="17" font-weight="700" fill="#0c1c22">Profile, Account &amp; Settings &#8212; User Flowchart</text>
<text x="40" y="50" font-size="13" fill="#5a6b78">YouCam Muse Web &#8212; desktop 1403×697 (D8) &#183; matches spec v1, 2026-08-31</text>
<text x="40" y="70" font-size="12" fill="#5a6b78">amber = decision &#183; red = error state &#183; green = success / resolved</text>

<g transform="translate(0,80)">
<text x="40" y="65" font-size="12" fill="#5a6b78">Six branches off one signed-in entry point, not a sequence &#8212; a visit touches whichever rows it touches. Every &quot;not captured&quot; node is another spec's territory (S5/S6/area 04); this diagram does not draw past it.</text>
<rect x="500" y="100" width="180" height="65" rx="20" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5"/>
<text x="590" y="120" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">/profile</text>
<text x="590" y="138" font-size="12" fill="#5a6b78" text-anchor="middle">Signed in, auth-gated &#183;</text>
<text x="590" y="153" font-size="12" fill="#5a6b78" text-anchor="middle">P1-S1, P1-S2</text>
<rect x="20" y="100" width="180" height="82" rx="8" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="110" y="120" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Credits / MVs / Songs</text>
<text x="110" y="137" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">tiles</text>
<text x="110" y="155" font-size="12" fill="#5a6b78" text-anchor="middle">Destinations named, not</text>
<text x="110" y="170" font-size="12" fill="#5a6b78" text-anchor="middle">toured &#183; P1-S1</text>
<path d="M500 132.5 L440 132.5 L440 141 L200 141" fill="none" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="110" y="92" font-size="11" fill="#5a6b78" text-anchor="middle">tap a tile</text>
<polygon points="590,158 688.989,190 590,222 491.011,190" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="590" y="195" font-size="13" font-weight="700" fill="#0c1c22" text-anchor="middle">Edit Profile?</text>
<line x1="590" y1="165" x2="590" y2="158" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<rect x="240" y="280" width="180" height="82" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="330" y="300" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Name/avatar updated,</text>
<text x="330" y="317" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">toast</text>
<text x="330" y="335" font-size="12" fill="#5a6b78" text-anchor="middle">In-memory only &#183; P2-S3</text>
<text x="330" y="350" font-size="12" fill="#5a6b78" text-anchor="middle">(AC-PROF-03)</text>
<line x1="590" y1="222" x2="330" y2="280" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="456.952" y="237.336" font-size="12" fill="#5a6b78" text-anchor="middle">Save</text>
<polygon points="590,348 704.457,380 590,412 475.543,380" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="590" y="385" font-size="13" font-weight="700" fill="#0c1c22" text-anchor="middle">Muse Pro tap?</text>
<line x1="590" y1="165" x2="590" y2="348" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<rect x="240" y="470" width="180" height="65" rx="8" fill="#fdecec" stroke="#e08a8a" stroke-width="1.5"/>
<text x="330" y="490" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">SubscribeModal</text>
<text x="330" y="508" font-size="12" fill="#5a6b78" text-anchor="middle">S5, on hold &#8212; not captured &#183;</text>
<text x="330" y="523" font-size="12" fill="#5a6b78" text-anchor="middle">P3-S1</text>
<path d="M475.543 380 L447.772 380 L447.772 502.5 L420 502.5" fill="none" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="330" y="462" font-size="11" fill="#5a6b78" text-anchor="middle">not subscribed</text>
<rect x="830" y="470" width="180" height="65" rx="8" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="920" y="490" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">/profile/credits</text>
<text x="920" y="508" font-size="12" fill="#5a6b78" text-anchor="middle">S5 &#8212; named, not toured &#183;</text>
<text x="920" y="523" font-size="12" fill="#5a6b78" text-anchor="middle">P3-S2</text>
<path d="M704.457 380 L767.228 380 L767.228 502.5 L830 502.5" fill="none" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="920" y="462" font-size="11" fill="#5a6b78" text-anchor="middle">subscribed</text>
<polygon points="590,528 736.185,560 590,592 443.815,560" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="590" y="565" font-size="13" font-weight="700" fill="#0c1c22" text-anchor="middle">Change Language?</text>
<line x1="590" y1="165" x2="590" y2="528" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<rect x="240" y="650" width="250" height="65" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="365" y="670" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">URL + Language subtitle update</text>
<text x="365" y="688" font-size="12" fill="#5a6b78" text-anchor="middle">Rest of screen stays English &#183; P3-S4</text>
<text x="365" y="703" font-size="12" fill="#5a6b78" text-anchor="middle">(AC-PROF-05)</text>
<line x1="590" y1="592" x2="365" y2="650" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="474.005" y="607.443" font-size="12" fill="#5a6b78" text-anchor="middle">pick a locale</text>
<rect x="500" y="740" width="180" height="50" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="590" y="760" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">/settings</text>
<text x="590" y="778" font-size="12" fill="#5a6b78" text-anchor="middle">P4-S1</text>
<line x1="590" y1="165" x2="590" y2="740" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="602" y="446.5" font-size="12" fill="#5a6b78" text-anchor="start">Settings row</text>
