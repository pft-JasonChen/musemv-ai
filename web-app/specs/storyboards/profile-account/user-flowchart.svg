<text x="945" y="958" font-size="12" fill="#5a6b78" text-anchor="middle">D11 correction &#183; P4-S6</text>
<path d="M722.234 830 L776.117 830 L776.117 945 L830 945" fill="none" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="945" y="912" font-size="11" fill="#5a6b78" text-anchor="middle">subOnApp on (?demo=1)</text>
<polygon points="590,978 739.26,1010 590,1042 440.74,1010" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="590" y="1015" font-size="13" font-weight="700" fill="#0c1c22" text-anchor="middle">Delete Account tap?</text>
<line x1="590" y1="790" x2="590" y2="978" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<rect x="240" y="1100" width="180" height="65" rx="8" fill="#e3f7ea" stroke="#6cc79a" stroke-width="1.5"/>
<text x="330" y="1120" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Demo toast -&gt; Home</text>
<text x="330" y="1138" font-size="12" fill="#5a6b78" text-anchor="middle">Nothing deleted &#183; P4-S5</text>
<text x="330" y="1153" font-size="12" fill="#5a6b78" text-anchor="middle">(AC-PROF-07)</text>
<line x1="590" y1="1042" x2="330" y2="1100" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="456.952" y="1057.34" font-size="12" fill="#5a6b78" text-anchor="middle">confirm</text>
<rect x="830" y="1010" width="180" height="65" rx="8" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="920" y="1030" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Sign Out row</text>
<text x="920" y="1048" font-size="12" fill="#5a6b78" text-anchor="middle">Flow owned by S6 &#183; P4-S1</text>
<text x="920" y="1063" font-size="12" fill="#5a6b78" text-anchor="middle">(AC-PROF-06)</text>
<path d="M680 765 L755 765 L755 1042.5 L830 1042.5" fill="none" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="920" y="1002" font-size="11" fill="#5a6b78" text-anchor="middle">row shown</text>
<rect x="500" y="1150" width="180" height="80" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="590" y="1170" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Send Feedback</text>
<text x="590" y="1188" font-size="12" fill="#5a6b78" text-anchor="middle">FORM: Type -&gt; Description</text>
<text x="590" y="1203" font-size="12" fill="#5a6b78" text-anchor="middle">-&gt; Attachment -&gt; Email &#183;</text>
<text x="590" y="1218" font-size="12" fill="#5a6b78" text-anchor="middle">P5-S1</text>
<line x1="590" y1="165" x2="590" y2="1150" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="602" y="651.5" font-size="12" fill="#5a6b78" text-anchor="start">Send Feedback row</text>
<polygon points="590,1208 727.631,1240 590,1272 452.369,1240" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="590" y="1245" font-size="13" font-weight="700" fill="#0c1c22" text-anchor="middle">Send (valid form)?</text>
<line x1="590" y1="1230" x2="590" y2="1208" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<rect x="240" y="1330" width="180" height="65" rx="8" fill="#e3f7ea" stroke="#6cc79a" stroke-width="1.5"/>
<text x="330" y="1350" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Feedback Sent + Done</text>
<text x="330" y="1368" font-size="12" fill="#5a6b78" text-anchor="middle">No toast &#183; P5-S7</text>
<text x="330" y="1383" font-size="12" fill="#5a6b78" text-anchor="middle">(AC-PROF-13)</text>
<line x1="590" y1="1272" x2="330" y2="1330" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
