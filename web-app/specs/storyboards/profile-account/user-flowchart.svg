<text x="110" y="850" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Terms / Privacy</text>
<text x="110" y="868" font-size="12" fill="#5a6b78" text-anchor="middle">Real links, new tab &#183; P4-S1</text>
<text x="110" y="883" font-size="12" fill="#5a6b78" text-anchor="middle">(AC-PROF-09)</text>
<path d="M500 765 L440 765 L440 862.5 L200 862.5" fill="none" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="110" y="822" font-size="11" fill="#5a6b78" text-anchor="middle">tap</text>
<polygon points="590,798 722.234,830 590,862 457.766,830" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="590" y="835" font-size="13" font-weight="700" fill="#0c1c22" text-anchor="middle">Unsubscribe tap?</text>
<line x1="590" y1="790" x2="590" y2="798" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<rect x="240" y="920" width="230" height="65" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="355" y="940" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Confirm -&gt; demo toast</text>
<text x="355" y="958" font-size="12" fill="#5a6b78" text-anchor="middle">subscribed unchanged &#183; P4-S2, P4-S3</text>
<text x="355" y="973" font-size="12" fill="#5a6b78" text-anchor="middle">(AC-PROF-07)</text>
<path d="M457.766 830 L397.766 830 L397.766 952.5 L470 952.5" fill="none" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<text x="355" y="912" font-size="11" fill="#5a6b78" text-anchor="middle">subOnApp off (default)</text>
<rect x="830" y="920" width="230" height="50" rx="8" fill="#fdecec" stroke="#e08a8a" stroke-width="1.5"/>
