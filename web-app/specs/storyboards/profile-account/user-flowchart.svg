<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="2070" viewBox="0 0 1180 2070" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" role="img">
<title>Profile, Account &amp; Settings &#8212; User Flowchart</title>
<defs><marker id="fc-primary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#5a6b78" stroke-width="1.5"/></marker><marker id="fc-error" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#d6484a" stroke-width="1.5"/></marker><marker id="fc-structural" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#a8b2ba" stroke-width="1.5"/></marker><marker id="fc-deferred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#a8b2ba" stroke-width="1.5"/></marker><marker id="fc-retry" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#6cc7e6" stroke-width="1.5"/></marker></defs>
<rect width="1180" height="2070" fill="#ffffff"/>
<text x="40" y="30" font-size="17" font-weight="700" fill="#0c1c22">Profile, Account &amp; Settings &#8212; User Flowchart</text>
<text x="40" y="50" font-size="13" fill="#5a6b78">YouCam Muse Web &#8212; desktop 1403×697 (D8) &#183; matches spec v1, 2026-08-31</text>
<text x="40" y="70" font-size="12" fill="#5a6b78">amber = decision &#183; red = error state &#183; green = success / resolved</text>

<g transform="translate(0,80)">
<text x="40" y="65" font-size="12" fill="#5a6b78">Six branches off one signed-in entry point, not a sequence &#8212; a visit touches whichever rows it touches.</text>
<text x="40" y="85" font-size="12" fill="#5a6b78">Every &quot;not captured&quot; node is another spec&#8217;s territory (S5/S6/area 04); this diagram does not draw past it.</text>
<line x1="40" y1="128" x2="1140" y2="128" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="150" font-size="15" font-weight="700" fill="#0c1c22">Part 1 &#8212; /profile, signed in  &#183;  P1</text>
<rect x="40" y="180" width="300" height="50" rx="20" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5"/>
<text x="190" y="200" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">/profile</text>
<text x="190" y="218" font-size="12" fill="#5a6b78" text-anchor="middle">Signed in, auth-gated &#183; P1-S1, P1-S2</text>
<rect x="820" y="180" width="300" height="50" rx="8" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="970" y="200" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Credits / MVs / Songs tiles</text>
<text x="970" y="218" font-size="12" fill="#5a6b78" text-anchor="middle">Destinations named, not toured &#183; P1-S1</text>
<line x1="340" y1="205" x2="820" y2="205" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="580" y="191" font-size="12" fill="#5a6b78" text-anchor="middle">tap a tile</text>
<text x="40" y="262" font-size="12" fill="#5a6b78">Parts 2&#8211;5 below each START from this screen. They are branches off it, not steps after it.</text>
<line x1="40" y1="298" x2="1140" y2="298" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="320" font-size="15" font-weight="700" fill="#0c1c22">Part 2 &#8212; Edit Profile  &#183;  P2</text>
<polygon points="200,348 298.989,380 200,412 101.011,380" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="200" y="385" font-size="13" font-weight="700" fill="#0c1c22" text-anchor="middle">Edit Profile?</text>
<rect x="820" y="350" width="300" height="50" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="970" y="370" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Name/avatar updated, toast</text>
<text x="970" y="388" font-size="12" fill="#5a6b78" text-anchor="middle">In-memory only &#183; P2-S3 (AC-PROF-03)</text>
<line x1="298.989" y1="380" x2="820" y2="375" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="559.36" y="363.501" font-size="12" fill="#5a6b78" text-anchor="middle">Save</text>
<line x1="40" y1="428" x2="1140" y2="428" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="450" font-size="15" font-weight="700" fill="#0c1c22">Part 3 &#8212; Muse Pro and Language  &#183;  P3</text>
<polygon points="200,478 314.457,510 200,542 85.5433,510" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="200" y="515" font-size="13" font-weight="700" fill="#0c1c22" text-anchor="middle">Muse Pro tap?</text>
<rect x="480" y="480" width="300" height="50" rx="8" fill="#fdecec" stroke="#e08a8a" stroke-width="1.5"/>
<text x="630" y="500" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">SubscribeModal</text>
<text x="630" y="518" font-size="12" fill="#5a6b78" text-anchor="middle">S5, on hold &#8212; not captured &#183; P3-S1</text>
<line x1="314.457" y1="510" x2="480" y2="505" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="396.806" y="493.506" font-size="12" fill="#5a6b78" text-anchor="middle">not subscribed</text>
<rect x="820" y="570" width="300" height="50" rx="8" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="970" y="590" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">/profile/credits</text>
<text x="970" y="608" font-size="12" fill="#5a6b78" text-anchor="middle">S5 &#8212; named, not toured &#183; P3-S2</text>
<line x1="200" y1="542" x2="820" y2="595" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="511.192" y="554.551" font-size="12" fill="#5a6b78" text-anchor="middle">subscribed</text>
<polygon points="200,648 346.185,680 200,712 53.8146,680" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="200" y="685" font-size="13" font-weight="700" fill="#0c1c22" text-anchor="middle">Change Language?</text>
<rect x="820" y="660" width="300" height="65" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="970" y="680" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">URL + Language subtitle update</text>
<text x="970" y="698" font-size="12" fill="#5a6b78" text-anchor="middle">Rest of screen stays English &#183; P3-S4</text>
<text x="970" y="713" font-size="12" fill="#5a6b78" text-anchor="middle">(AC-PROF-05)</text>
<line x1="346.185" y1="680" x2="820" y2="692.5" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="583.462" y="672.255" font-size="12" fill="#5a6b78" text-anchor="middle">pick a locale</text>
<line x1="40" y1="748" x2="1140" y2="748" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="770" font-size="15" font-weight="700" fill="#0c1c22">Part 4 &#8212; /settings: Terms, Sign Out, Unsubscribe  &#183;  P4</text>
<rect x="40" y="800" width="300" height="50" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="190" y="820" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">/settings</text>
<text x="190" y="838" font-size="12" fill="#5a6b78" text-anchor="middle">P4-S1</text>
<rect x="820" y="800" width="300" height="50" rx="8" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="970" y="820" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Terms / Privacy</text>
<text x="970" y="838" font-size="12" fill="#5a6b78" text-anchor="middle">Real links, new tab &#183; P4-S1 (AC-PROF-09)</text>
<line x1="340" y1="825" x2="820" y2="825" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="580" y="811" font-size="12" fill="#5a6b78" text-anchor="middle">tap</text>
<rect x="820" y="900" width="300" height="50" rx="8" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="970" y="920" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Sign Out row</text>
<text x="970" y="938" font-size="12" fill="#5a6b78" text-anchor="middle">Flow owned by S6 &#183; P4-S1 (AC-PROF-06)</text>
<line x1="190" y1="850" x2="820" y2="925" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="506.655" y="873.598" font-size="12" fill="#5a6b78" text-anchor="middle">row shown</text>
<polygon points="200,918 332.234,950 200,982 67.7663,950" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="200" y="955" font-size="13" font-weight="700" fill="#0c1c22" text-anchor="middle">Unsubscribe tap?</text>
<line x1="190" y1="850" x2="200" y2="918" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<rect x="480" y="930" width="300" height="65" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="630" y="950" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Confirm -&gt; demo toast</text>
<text x="630" y="968" font-size="12" fill="#5a6b78" text-anchor="middle">subscribed unchanged &#183; P4-S2, P4-S3</text>
<text x="630" y="983" font-size="12" fill="#5a6b78" text-anchor="middle">(AC-PROF-07)</text>
<line x1="332.234" y1="950" x2="480" y2="962.5" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<text x="407.297" y="942.3" font-size="12" fill="#5a6b78" text-anchor="middle">subOnApp off (default)</text>
<rect x="820" y="1060" width="300" height="50" rx="8" fill="#fdecec" stroke="#e08a8a" stroke-width="1.5"/>
<text x="970" y="1080" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Manage-on-your-phone dialog</text>
<text x="970" y="1098" font-size="12" fill="#5a6b78" text-anchor="middle">D11 correction &#183; P4-S6</text>
<line x1="200" y1="982" x2="820" y2="1085" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="512.294" y="1019.69" font-size="12" fill="#5a6b78" text-anchor="middle">subOnApp on (?demo=1)</text>
<line x1="40" y1="1158" x2="1140" y2="1158" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="1180" font-size="15" font-weight="700" fill="#0c1c22">Part 4 (continued) &#8212; /settings: Delete Account  &#183;  P4</text>
<polygon points="200,1218 349.26,1250 200,1282 50.7404,1250" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="200" y="1255" font-size="13" font-weight="700" fill="#0c1c22" text-anchor="middle">Delete Account tap?</text>
<rect x="480" y="1220" width="300" height="50" rx="8" fill="#e3f7ea" stroke="#6cc79a" stroke-width="1.5"/>
<text x="630" y="1240" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Demo toast -&gt; Home</text>
<text x="630" y="1258" font-size="12" fill="#5a6b78" text-anchor="middle">Nothing deleted &#183; P4-S5 (AC-PROF-07)</text>
<line x1="349.26" y1="1250" x2="480" y2="1245" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="414.095" y="1233.51" font-size="12" fill="#5a6b78" text-anchor="middle">confirm</text>
<line x1="40" y1="1328" x2="1140" y2="1328" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="1350" font-size="15" font-weight="700" fill="#0c1c22">Part 5 &#8212; Send Feedback  &#183;  P5</text>
<rect x="40" y="1380" width="300" height="65" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="190" y="1400" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Send Feedback</text>
<text x="190" y="1418" font-size="12" fill="#5a6b78" text-anchor="middle">FORM: Type -&gt; Description -&gt; Attachment -&gt; Email</text>
<text x="190" y="1433" font-size="12" fill="#5a6b78" text-anchor="middle">&#183; P5-S1</text>
<rect x="820" y="1380" width="300" height="50" rx="8" fill="#fdecec" stroke="#e08a8a" stroke-width="1.5"/>
<text x="970" y="1400" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Attachment refused whole</text>
<text x="970" y="1418" font-size="12" fill="#5a6b78" text-anchor="middle">5 MB cumulative &#183; P5-S6 (AC-PROF-15)</text>
<line x1="340" y1="1412.5" x2="820" y2="1405" stroke="#d6484a" stroke-width="1.5" marker-end="url(#fc-error)"/>
<text x="579.781" y="1394.75" font-size="12" fill="#5a6b78" text-anchor="middle">pick &gt; budget</text>
<polygon points="200,1498 337.631,1530 200,1562 62.3692,1530" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="200" y="1535" font-size="13" font-weight="700" fill="#0c1c22" text-anchor="middle">Send (valid form)?</text>
<line x1="190" y1="1445" x2="200" y2="1498" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<rect x="480" y="1500" width="300" height="50" rx="8" fill="#e3f7ea" stroke="#6cc79a" stroke-width="1.5"/>
<text x="630" y="1520" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Feedback Sent + Done</text>
<text x="630" y="1538" font-size="12" fill="#5a6b78" text-anchor="middle">No toast &#183; P5-S7 (AC-PROF-13)</text>
<line x1="337.631" y1="1530" x2="480" y2="1525" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="408.324" y="1513.51" font-size="12" fill="#5a6b78" text-anchor="middle">resolves</text>
<rect x="820" y="1600" width="300" height="50" rx="8" fill="#fdecec" stroke="#e08a8a" stroke-width="1.5"/>
<text x="970" y="1620" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Inline error, draft preserved</text>
<text x="970" y="1638" font-size="12" fill="#5a6b78" text-anchor="middle">Not reachable in this build &#183; P5-E9 (Q-02)</text>
<line x1="200" y1="1562" x2="820" y2="1625" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="511.415" y="1579.57" font-size="12" fill="#5a6b78" text-anchor="middle">rejects (undemonstrable)</text>
<line x1="40" y1="1688" x2="1140" y2="1688" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="1710" font-size="15" font-weight="700" fill="#0c1c22">Part 6 &#8212; /settings with no session  &#183;  P6</text>
<rect x="40" y="1740" width="300" height="50" rx="20" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5"/>
<text x="190" y="1760" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">/settings, logged out</text>
<text x="190" y="1778" font-size="12" fill="#5a6b78" text-anchor="middle">Separate entry &#8212; no session &#183; P6-S1</text>
<rect x="820" y="1740" width="300" height="50" rx="8" fill="#fdecec" stroke="#e08a8a" stroke-width="1.5"/>
<text x="970" y="1760" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Sign-in modal; dismiss -&gt; Home</text>
<text x="970" y="1778" font-size="12" fill="#5a6b78" text-anchor="middle">AC-PROF-17</text>
<line x1="340" y1="1765" x2="820" y2="1765" stroke="#d6484a" stroke-width="1.5" marker-end="url(#fc-error)"/>
<text x="580" y="1751" font-size="12" fill="#5a6b78" text-anchor="middle">AuthGuard</text>
<line x1="40" y1="1846" x2="1140" y2="1846" stroke="#e5e9ed" stroke-width="1"/>
<line x1="40" y1="1866" x2="74" y2="1866" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="86" y="1870" font-size="12" fill="#5a6b78">Deferred / reused elsewhere</text>
<line x1="40" y1="1886" x2="74" y2="1886" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="86" y="1890" font-size="12" fill="#5a6b78">Primary happy path</text>
<line x1="40" y1="1906" x2="74" y2="1906" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<text x="86" y="1910" font-size="12" fill="#5a6b78">Structural navigation (entry, exit, close)</text>
<line x1="40" y1="1926" x2="74" y2="1926" stroke="#d6484a" stroke-width="1.5" marker-end="url(#fc-error)"/>
<text x="86" y="1930" font-size="12" fill="#5a6b78">Error branch</text>
</g>
</svg>
