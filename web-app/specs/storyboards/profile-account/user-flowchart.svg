<path d="M680 1442.5 L755 1442.5 L755 1443.5 L830 1443.5" fill="none" stroke="#d6484a" stroke-width="1.5" marker-end="url(#fc-error)"/>
<text x="920" y="1402" font-size="11" fill="#5a6b78" text-anchor="middle">AuthGuard</text>
<line x1="40" y1="1706" x2="1140" y2="1706" stroke="#e5e9ed" stroke-width="1"/>
<line x1="40" y1="1726" x2="74" y2="1726" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="86" y="1730" font-size="12" fill="#5a6b78">Deferred / reused elsewhere</text>
<line x1="40" y1="1746" x2="74" y2="1746" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
