<text x="590" y="1463" font-size="12" fill="#5a6b78" text-anchor="middle">&#183; P6-S1</text>
<rect x="830" y="1410" width="180" height="67" rx="8" fill="#fdecec" stroke="#e08a8a" stroke-width="1.5"/>
<text x="920" y="1430" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Sign-in modal; dismiss</text>
<text x="920" y="1447" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">-&gt; Home</text>
