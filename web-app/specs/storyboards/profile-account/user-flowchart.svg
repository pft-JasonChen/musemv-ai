<text x="920" y="1385" font-size="12" fill="#5a6b78" text-anchor="middle">Not reachable in this build &#183;</text>
<text x="920" y="1400" font-size="12" fill="#5a6b78" text-anchor="middle">P5-E9 (Q-02)</text>
<path d="M727.631 1240 L778.815 1240 L778.815 1371 L830 1371" fill="none" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="920" y="1322" font-size="11" fill="#5a6b78" text-anchor="middle">rejects (undemonstrable)</text>
<rect x="20" y="1240" width="180" height="82" rx="8" fill="#fdecec" stroke="#e08a8a" stroke-width="1.5"/>
<text x="110" y="1260" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Attachment refused</text>
<text x="110" y="1277" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">whole</text>
