<text x="590" y="233" font-size="12" fill="#5a6b78" text-anchor="middle">type, song (via Trim),</text>
<text x="590" y="248" font-size="12" fill="#5a6b78" text-anchor="middle">description, photo &#183;</text>
<text x="590" y="263" font-size="12" fill="#5a6b78" text-anchor="middle">P1-S1..S8</text>
