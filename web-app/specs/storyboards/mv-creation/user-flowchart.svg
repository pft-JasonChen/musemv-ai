<text x="950" y="267" font-size="11" fill="#5a6b78" text-anchor="middle">insufficient credits</text>
<rect x="30" y="195" width="180" height="65" rx="8" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5" stroke-dasharray="5 4"/>
