<text x="950" y="213" font-size="12" fill="#5a6b78" text-anchor="middle">Sign-in gate opens &#183;</text>
<text x="950" y="228" font-size="12" fill="#5a6b78" text-anchor="middle">P5-S1..S4</text>
<rect x="860" y="275" width="180" height="50" rx="8" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="950" y="295" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Balance below cost</text>
