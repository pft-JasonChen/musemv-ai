<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1430" viewBox="0 0 1240 1430" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" role="img">
<title>Explore &amp;amp; Community &#8212; User Flowchart</title>
<defs><marker id="fc-primary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#5a6b78" stroke-width="1.5"/></marker><marker id="fc-error" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#d6484a" stroke-width="1.5"/></marker><marker id="fc-structural" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#a8b2ba" stroke-width="1.5"/></marker><marker id="fc-deferred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#a8b2ba" stroke-width="1.5"/></marker><marker id="fc-retry" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#6cc7e6" stroke-width="1.5"/></marker></defs>
<rect width="1240" height="1430" fill="#ffffff"/>
<text x="40" y="30" font-size="17" font-weight="700" fill="#0c1c22">Explore &amp;amp; Community &#8212; User Flowchart</text>
<text x="40" y="50" font-size="13" fill="#5a6b78">YouCam Muse Web &#8212; desktop 1440 (D8) &#183; matches spec v1, 2026-09-01</text>
<text x="40" y="70" font-size="12" fill="#5a6b78">coral = human hand-off &#183; amber = decision &#183; blue = system response &#183; green = success / resolved &#183; red = error state</text>

<g transform="translate(0,80)">
<text x="40" y="58" font-size="12" fill="#5a6b78">A hub, not a sequence. Every route here is PUBLIC &#8212; nothing is behind a route guard; the sign-in gate sits at the ACTION (Create / Like), which is why it is one node with many edges into it. Every rail and grid is a static seed array in array order.</text>
<rect x="530" y="118" width="340" height="50" rx="20" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5"/>
<text x="700" y="138" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">/ &#8212; Home feed</text>
<text x="700" y="156" font-size="12" fill="#5a6b78" text-anchor="middle">Hero + tool selector + three seed rails &#183; P1-S1</text>
<rect x="10" y="210" width="300" height="65" rx="8" fill="#fdece9" stroke="#e8a99f" stroke-width="1.5"/>
<text x="160" y="230" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Sign-in modal &#8212; at the action</text>
<text x="160" y="248" font-size="12" fill="#5a6b78" text-anchor="middle">requireLogin, then the action runs &#183; P1-S8, P4-S8</text>
<text x="160" y="263" font-size="12" fill="#5a6b78" text-anchor="middle">(AC-EXP-02/08)</text>
<path d="M530 143 L470 143 L470 210 L160 210" fill="none" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="160" y="202" font-size="11" fill="#5a6b78" text-anchor="middle">Create MV / Create Song / Create / Like, logged out</text>
<polygon points="620,183 758.396,215 620,247 481.604,215" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="620" y="220" font-size="13" font-weight="700" fill="#0c1c22" text-anchor="middle">Which rail control?</text>
<line x1="700" y1="168" x2="620" y2="183" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<rect x="870" y="300" width="300" height="65" rx="8" fill="#e0f7fd" stroke="#6cc7e6" stroke-width="1.5"/>
<text x="1020" y="320" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">SongPlayBar preview &#8212; in place</text>
<text x="1020" y="338" font-size="12" fill="#5a6b78" text-anchor="middle">Album art previews; the row TITLE navigates &#183;</text>
<text x="1020" y="353" font-size="12" fill="#5a6b78" text-anchor="middle">P1-S5 (AC-EXP-03)</text>
<path d="M758.396 215 L814.198 215 L814.198 332.5 L870 332.5" fill="none" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<text x="1020" y="292" font-size="11" fill="#5a6b78" text-anchor="middle">a song row&#8217;s album art</text>
<rect x="230" y="330" width="250" height="65" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="355" y="350" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">/explore/mvs</text>
<text x="355" y="368" font-size="12" fill="#5a6b78" text-anchor="middle">Top Picks (3) + Newly Released (11),</text>
<text x="355" y="383" font-size="12" fill="#5a6b78" text-anchor="middle">uncapped &#183; P2-S1</text>
<path d="M481.604 215 L436.604 215 L436.604 330 L355 330" fill="none" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="355" y="322" font-size="11" fill="#5a6b78" text-anchor="middle">&quot;See all&quot; on Trending Music Videos</text>
<rect x="550" y="400" width="250" height="65" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="675" y="420" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">/explore/songs</text>
<text x="675" y="438" font-size="12" fill="#5a6b78" text-anchor="middle">Top Picks rail + All &amp; the nine genre tabs &#183;</text>
<text x="675" y="453" font-size="12" fill="#5a6b78" text-anchor="middle">P3-S1</text>
<line x1="620" y1="247" x2="675" y2="400" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="659.5" y="317.5" font-size="12" fill="#5a6b78" text-anchor="start">&quot;See all&quot; on either songs rail</text>
<rect x="230" y="470" width="250" height="65" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="355" y="490" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">/watch?id=</text>
<text x="355" y="508" font-size="12" fill="#5a6b78" text-anchor="middle">3:4 or 4:3 stage, floating meta, transport &#183;</text>
<text x="355" y="523" font-size="12" fill="#5a6b78" text-anchor="middle">P4-S1 (AC-EXP-04)</text>
<line x1="355" y1="395" x2="355" y2="470" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="367" y="426.5" font-size="12" fill="#5a6b78" text-anchor="start">a card</text>
<path d="M530 143 L500 143 L500 502.5 L230 502.5" fill="none" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="355" y="462" font-size="11" fill="#5a6b78" text-anchor="middle">an MV card on the Trending rail</text>
<rect x="-110" y="470" width="300" height="97" rx="8" fill="#e0f7fd" stroke="#6cc7e6" stroke-width="1.5"/>
<text x="40" y="490" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Swipe up / down &#8212; next / prev in the</text>
<text x="40" y="507" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">feed</text>
<text x="40" y="525" font-size="12" fill="#5a6b78" text-anchor="middle">Commits past 80/693 of stage height;</text>
<text x="40" y="540" font-size="12" fill="#5a6b78" text-anchor="middle">router.replace, no page load &#183; P4-S4, P4-S5</text>
<text x="40" y="555" font-size="12" fill="#5a6b78" text-anchor="middle">(AC-EXP-11)</text>
<path d="M230 502.5 L210 502.5 L210 518.5 L190 518.5" fill="none" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<text x="40" y="462" font-size="11" fill="#5a6b78" text-anchor="middle">drag the stage</text>
<polygon points="320,538 418.975,570 320,602 221.025,570" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="320" y="575" font-size="13" font-weight="700" fill="#0c1c22" text-anchor="middle">Official MV?</text>
<line x1="355" y1="535" x2="320" y2="538" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<rect x="-110" y="650" width="290" height="65" rx="8" fill="#e0f7fd" stroke="#6cc7e6" stroke-width="1.5"/>
<text x="35" y="670" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">YCM watermark over the video</text>
<text x="35" y="688" font-size="12" fill="#5a6b78" text-anchor="middle">isOfficialMv &#8212; the eight hero MVs only &#183; P4-S3</text>
<text x="35" y="703" font-size="12" fill="#5a6b78" text-anchor="middle">(AC-EXP-10)</text>
<path d="M221.025 570 L200.513 570 L200.513 682.5 L180 682.5" fill="none" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<text x="35" y="642" font-size="11" fill="#5a6b78" text-anchor="middle">yes</text>
<rect x="550" y="560" width="250" height="65" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="675" y="580" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">/song/play?id=</text>
<text x="675" y="598" font-size="12" fill="#5a6b78" text-anchor="middle">Same screen as /explore/songs; the bar</text>
<text x="675" y="613" font-size="12" fill="#5a6b78" text-anchor="middle">opens on play &#183; P5-S1, P5-S2</text>
<line x1="675" y1="465" x2="675" y2="560" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="687" y="506.5" font-size="12" fill="#5a6b78" text-anchor="start">a row, or a deep link</text>
<path d="M870 143 L900 143 L900 592.5 L800 592.5" fill="none" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="675" y="552" font-size="11" fill="#5a6b78" text-anchor="middle">a Top Picks / New Songs card</text>
<rect x="870" y="640" width="290" height="65" rx="8" fill="#e0f7fd" stroke="#6cc7e6" stroke-width="1.5"/>
<text x="1015" y="660" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">The playlist follows the song</text>
<text x="1015" y="678" font-size="12" fill="#5a6b78" text-anchor="middle">A creator id swaps the list; no tab is active &#183;</text>
<text x="1015" y="693" font-size="12" fill="#5a6b78" text-anchor="middle">P5-S3 (EXP-09)</text>
<path d="M800 592.5 L835 592.5 L835 672.5 L870 672.5" fill="none" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<text x="1015" y="632" font-size="11" fill="#5a6b78" text-anchor="middle">a cps- id</text>
<rect x="-110" y="780" width="290" height="65" rx="8" fill="#e3f7ea" stroke="#6cc79a" stroke-width="1.5"/>
<text x="35" y="800" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">/mv/room &#8212; pre-filled</text>
<text x="35" y="818" font-size="12" fill="#5a6b78" text-anchor="middle">mvType + prompt + matched song &#183; P4-S10 (area</text>
<text x="35" y="833" font-size="12" fill="#5a6b78" text-anchor="middle">02, S2)</text>
<path d="M230 502.5 L132.5 502.5 L132.5 780 L35 780" fill="none" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="35" y="772" font-size="11" fill="#5a6b78" text-anchor="middle">Create Music Video</text>
<rect x="870" y="780" width="290" height="50" rx="8" fill="#e3f7ea" stroke="#6cc79a" stroke-width="1.5"/>
<text x="1015" y="800" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">/song/create &#8212; pre-filled</text>
<text x="1015" y="818" font-size="12" fill="#5a6b78" text-anchor="middle">genre + mood + title + lyrics &#183; P3-S5 (area 03, S1)</text>
<path d="M800 592.5 L907.5 592.5 L907.5 780 L1015 780" fill="none" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="1015" y="772" font-size="11" fill="#5a6b78" text-anchor="middle">Create AI Song</text>
<path d="M10 242.5 L-30 242.5 L-30 812.5 L-110 812.5" fill="none" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="35" y="772" font-size="11" fill="#5a6b78" text-anchor="middle">on success the queued action runs</text>
<rect x="530" y="880" width="340" height="65" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="700" y="900" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">/creator</text>
<text x="700" y="918" font-size="12" fill="#5a6b78" text-anchor="middle">Header + Plays / Likes + Music Videos / Songs tabs &#183;</text>
<text x="700" y="933" font-size="12" fill="#5a6b78" text-anchor="middle">P6-S1 (AC-EXP-06)</text>
<line x1="355" y1="535" x2="700" y2="880" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="537.399" y="697.601" font-size="12" fill="#5a6b78" text-anchor="middle">the creator link</text>
<line x1="675" y1="625" x2="700" y2="880" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="699.5" y="746.5" font-size="12" fill="#5a6b78" text-anchor="start">the creator link</text>
<polygon points="620,943 736.766,975 620,1007 503.234,975" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="620" y="980" font-size="13" font-weight="700" fill="#0c1c22" text-anchor="middle">Whose profile?</text>
<line x1="700" y1="945" x2="620" y2="943" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<rect x="230" y="1060" width="280" height="50" rx="8" fill="#e0f7fd" stroke="#6cc7e6" stroke-width="1.5"/>
<text x="370" y="1080" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Someone else&#8217;s &#8212; Like + Share inline</text>
<text x="370" y="1098" font-size="12" fill="#5a6b78" text-anchor="middle">No owner menu at all &#183; P6-S2</text>
<path d="M503.234 975 L443.234 975 L443.234 1085 L510 1085" fill="none" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<text x="370" y="1052" font-size="11" fill="#5a6b78" text-anchor="middle">a creator link (?self absent)</text>
<rect x="870" y="1060" width="300" height="82" rx="8" fill="#e0f7fd" stroke="#6cc7e6" stroke-width="1.5"/>
<text x="1020" y="1080" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Your own (?self=1) &#8212; six-slot owner</text>
<text x="1020" y="1097" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">menu</text>
<text x="1020" y="1115" font-size="12" fill="#5a6b78" text-anchor="middle">Edit MV / Create MV &#183; Like &#183; Share &#183; Publish &#183;</text>
<text x="1020" y="1130" font-size="12" fill="#5a6b78" text-anchor="middle">Download &#183; Delete &#183; P6-S4, P6-S5</text>
<path d="M736.766 975 L803.383 975 L803.383 1101 L870 1101" fill="none" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="1020" y="1052" font-size="11" fill="#5a6b78" text-anchor="middle">/profile stat tile (?self=1)</text>
<rect x="530" y="1160" width="380" height="65" rx="8" fill="#fdecec" stroke="#e08a8a" stroke-width="1.5"/>
<text x="720" y="1180" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">profileEmpty (?demo=1) &#8212; &quot;No works released yet&quot;</text>
<text x="720" y="1198" font-size="12" fill="#5a6b78" text-anchor="middle">Subtitle + a tab-specific CTA only on your own profile &#183; P6-S6,</text>
<text x="720" y="1213" font-size="12" fill="#5a6b78" text-anchor="middle">P6-S7 (AC-EXP-12)</text>
<path d="M530 912.5 L500 912.5 L500 1192.5 L530 1192.5" fill="none" stroke="#d6484a" stroke-width="1.5" marker-end="url(#fc-error)"/>
<text x="720" y="1152" font-size="11" fill="#5a6b78" text-anchor="middle">flag on</text>
<rect x="-110" y="1160" width="290" height="65" rx="8" fill="#fdecec" stroke="#e08a8a" stroke-width="1.5"/>
<text x="35" y="1180" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Not found &#8212; an Explore CTA</text>
<text x="35" y="1198" font-size="12" fill="#5a6b78" text-anchor="middle">An unresolvable id on either player &#183; P4-S11,</text>
<text x="35" y="1213" font-size="12" fill="#5a6b78" text-anchor="middle">P5-S4 (AC-EXP-09)</text>
<path d="M230 502.5 L132.5 502.5 L132.5 1160 L35 1160" fill="none" stroke="#d6484a" stroke-width="1.5" marker-end="url(#fc-error)"/>
<text x="35" y="1152" font-size="11" fill="#5a6b78" text-anchor="middle">unresolvable ?id</text>
<rect x="870" y="1160" width="340" height="65" rx="8" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="1040" y="1180" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Ranking &#183; eligibility &#183; moderation &#183; refresh</text>
<text x="1040" y="1198" font-size="12" fill="#5a6b78" text-anchor="middle">The Curation PRD&#8217;s whole layer &#8212; UNBUILT, no edge</text>
<text x="1040" y="1213" font-size="12" fill="#5a6b78" text-anchor="middle">passes through it (TBD-EXP-01/07)</text>
<line x1="40" y1="1246" x2="1200" y2="1246" stroke="#e5e9ed" stroke-width="1"/>
<line x1="40" y1="1266" x2="74" y2="1266" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="86" y="1270" font-size="12" fill="#5a6b78">Deferred / reused elsewhere</text>
<line x1="40" y1="1286" x2="74" y2="1286" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="86" y="1290" font-size="12" fill="#5a6b78">Primary happy path</text>
<line x1="40" y1="1306" x2="74" y2="1306" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<text x="86" y="1310" font-size="12" fill="#5a6b78">Structural navigation (entry, exit, close)</text>
<line x1="40" y1="1326" x2="74" y2="1326" stroke="#d6484a" stroke-width="1.5" marker-end="url(#fc-error)"/>
<text x="86" y="1330" font-size="12" fill="#5a6b78">Error branch</text>
</g>
</svg>
