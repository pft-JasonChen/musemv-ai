<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1180" viewBox="0 0 1180 1180" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" role="img">
<title>Share &#8212; User Flowchart</title>
<defs><marker id="fc-primary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#5a6b78" stroke-width="1.5"/></marker><marker id="fc-error" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#d6484a" stroke-width="1.5"/></marker><marker id="fc-structural" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#a8b2ba" stroke-width="1.5"/></marker><marker id="fc-deferred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#a8b2ba" stroke-width="1.5"/></marker><marker id="fc-retry" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#6cc7e6" stroke-width="1.5"/></marker></defs>
<rect width="1180" height="1180" fill="#ffffff"/>
<text x="40" y="30" font-size="17" font-weight="700" fill="#0c1c22">Share &#8212; User Flowchart</text>
<text x="40" y="50" font-size="13" fill="#5a6b78">YouCam Muse Web &#8212; desktop 1440 (D8) &#183; matches spec v1, 2026-09-01</text>
<text x="40" y="70" font-size="12" fill="#5a6b78">green = success / resolved &#183; amber = decision &#183; blue = system response &#183; red = error state</text>

<g transform="translate(0,80)">
<text x="40" y="58" font-size="12" fill="#5a6b78">Two halves. The SENDER mints a link from a dialog that is the same on every screen that offers it; the RECIPIENT opens that link with no account and no app chrome. Links do not expire &#8212; the unavailable state means an id that did not resolve, nothing else.</text>
<rect x="500" y="118" width="340" height="65" rx="20" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5"/>
<text x="670" y="138" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">A Share control anywhere in the app</text>
<text x="670" y="156" font-size="12" fill="#5a6b78" text-anchor="middle">MV / song result and player screens &#8212; their entry points</text>
<text x="670" y="171" font-size="12" fill="#5a6b78" text-anchor="middle">are captured by S8</text>
<rect x="500" y="205" width="340" height="50" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="670" y="225" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Share dialog &#8212; a read-only link and Copy</text>
<text x="670" y="243" font-size="12" fill="#5a6b78" text-anchor="middle">No social targets, no native share &#183; P5-S2 (AC-SHARE-04)</text>
<line x1="670" y1="183" x2="670" y2="205" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<rect x="840" y="205" width="280" height="50" rx="8" fill="#e3f7ea" stroke="#6cc79a" stroke-width="1.5"/>
<text x="980" y="225" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Copied! for 1.5s, then reverts</text>
<text x="980" y="243" font-size="12" fill="#5a6b78" text-anchor="middle">The clipboard holds the same link &#183; P5-S3</text>
<path d="M840 230 L890 230 L890 230 L840 230" fill="none" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<text x="980" y="197" font-size="11" fill="#5a6b78" text-anchor="middle">Copy</text>
<rect x="100" y="300" width="290" height="65" rx="8" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="245" y="320" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">The legacy MV share URL</text>
<text x="245" y="338" font-size="12" fill="#5a6b78" text-anchor="middle">Server redirect, language prefix kept &#183; P5-S1</text>
<text x="245" y="353" font-size="12" fill="#5a6b78" text-anchor="middle">(AC-SHARE-03)</text>
<rect x="500" y="320" width="380" height="50" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="690" y="340" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">/share?id= &#8212; bare, public, no app chrome</text>
<text x="690" y="358" font-size="12" fill="#5a6b78" text-anchor="middle">No sidebar, no tab bar, no navbar &#183; P1-S1 (AC-SHARE-01)</text>
<line x1="670" y1="255" x2="690" y2="320" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="692" y="281.5" font-size="12" fill="#5a6b78" text-anchor="start">the recipient opens the link</text>
<path d="M390 332.5 L440 332.5 L440 345 L500 345" fill="none" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<text x="690" y="312" font-size="11" fill="#5a6b78" text-anchor="middle">redirects to</text>
<polygon points="590,383 740.79,415 590,447 439.21,415" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="590" y="420" font-size="13" font-weight="700" fill="#0c1c22" text-anchor="middle">Does the id resolve?</text>
<line x1="690" y1="370" x2="590" y2="383" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<polygon points="240,478 396.966,510 240,542 83.0343,510" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="240" y="515" font-size="13" font-weight="700" fill="#0c1c22" text-anchor="middle">Which kind of media?</text>
<path d="M439.21 415 L379.21 415 L379.21 478 L240 478" fill="none" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="240" y="470" font-size="11" fill="#5a6b78" text-anchor="middle">community item &#183; a History sample &#183; your own completed creation</text>
<rect x="-20" y="610" width="280" height="50" rx="8" fill="#e0f7fd" stroke="#6cc7e6" stroke-width="1.5"/>
<text x="120" y="630" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">MV panel &#8212; video + controller</text>
<text x="120" y="648" font-size="12" fill="#5a6b78" text-anchor="middle">NO title, NO creator &#183; P1-S1, P1-S2</text>
<path d="M83.0343 510 L33.0343 510 L33.0343 635 L260 635" fill="none" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<text x="120" y="602" font-size="11" fill="#5a6b78" text-anchor="middle">a music video</text>
<rect x="340" y="610" width="300" height="50" rx="8" fill="#e0f7fd" stroke="#6cc7e6" stroke-width="1.5"/>
<text x="490" y="630" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Song panel &#8212; art, title, creator, controller</text>
<text x="490" y="648" font-size="12" fill="#5a6b78" text-anchor="middle">The only panel that identifies its media &#183; P3-S1</text>
<line x1="240" y1="542" x2="490" y2="610" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="368.674" y="562.491" font-size="12" fill="#5a6b78" text-anchor="middle">a song</text>
<rect x="-20" y="720" width="320" height="67" rx="8" fill="#e0f7fd" stroke="#6cc7e6" stroke-width="1.5"/>
<text x="140" y="740" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">More: Download &#183; Playback Speed &#183; Picture</text>
<text x="140" y="757" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">in Picture</text>
<text x="140" y="775" font-size="12" fill="#5a6b78" text-anchor="middle">Speed cycles and the menu stays open &#183; P2-S1, P2-S2</text>
<path d="M-20 635 L-70 635 L-70 720 L140 720" fill="none" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<text x="140" y="712" font-size="11" fill="#5a6b78" text-anchor="middle">More</text>
<rect x="160" y="820" width="340" height="65" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="330" y="840" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Two pills: Download, and Create</text>
<text x="330" y="858" font-size="12" fill="#5a6b78" text-anchor="middle">Create is kind-specific in LABEL only &#8212; both go home &#183;</text>
<text x="330" y="873" font-size="12" fill="#5a6b78" text-anchor="middle">P1-S3, P3-S3</text>
<line x1="120" y1="660" x2="330" y2="820" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="233.485" y="728.864" font-size="12" fill="#5a6b78" text-anchor="middle">always present</text>
<line x1="490" y1="660" x2="330" y2="820" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="400.101" y="730.101" font-size="12" fill="#5a6b78" text-anchor="middle">always present</text>
<rect x="160" y="920" width="290" height="50" rx="8" fill="#e3f7ea" stroke="#6cc79a" stroke-width="1.5"/>
<text x="305" y="940" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">The home page</text>
<text x="305" y="958" font-size="12" fill="#5a6b78" text-anchor="middle">The logo, and both Create pills, land here &#183; P1-S4</text>
<line x1="330" y1="885" x2="305" y2="920" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="329.5" y="896.5" font-size="12" fill="#5a6b78" text-anchor="start">Create</text>
<rect x="830" y="510" width="330" height="65" rx="8" fill="#fdecec" stroke="#e08a8a" stroke-width="1.5"/>
<text x="995" y="530" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">This link isn&#8217;t available</text>
<text x="995" y="548" font-size="12" fill="#5a6b78" text-anchor="middle">Unresolvable id &#183; no id at all &#183; ?type=expired &#183; P4-S1..S3</text>
<text x="995" y="563" font-size="12" fill="#5a6b78" text-anchor="middle">(AC-SHARE-02)</text>
<path d="M740.79 415 L800.79 415 L800.79 510 L995 510" fill="none" stroke="#d6484a" stroke-width="1.5" marker-end="url(#fc-error)"/>
<text x="995" y="502" font-size="11" fill="#5a6b78" text-anchor="middle">no &#8212; and there is no expiry rule behind it</text>
<path d="M1160 542.5 L1200 542.5 L1200 945 L450 945" fill="none" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<text x="305" y="912" font-size="11" fill="#5a6b78" text-anchor="middle">the header logo</text>
<rect x="830" y="640" width="330" height="50" rx="8" fill="#fdecec" stroke="#e08a8a" stroke-width="1.5"/>
<text x="995" y="660" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">A LIVE own creation, opened in a fresh tab</text>
<text x="995" y="678" font-size="12" fill="#5a6b78" text-anchor="middle">Resolves from memory only, so it lands here too &#183; P4-S4</text>
<line x1="995" y1="640" x2="995" y2="575" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="1007" y="601.5" font-size="12" fill="#5a6b78" text-anchor="start">no server-side resolution yet</text>
<line x1="40" y1="996" x2="1140" y2="996" stroke="#e5e9ed" stroke-width="1"/>
<line x1="40" y1="1016" x2="74" y2="1016" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="86" y="1020" font-size="12" fill="#5a6b78">Primary happy path</text>
<line x1="40" y1="1036" x2="74" y2="1036" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<text x="86" y="1040" font-size="12" fill="#5a6b78">Structural navigation (entry, exit, close)</text>
<line x1="40" y1="1056" x2="74" y2="1056" stroke="#d6484a" stroke-width="1.5" marker-end="url(#fc-error)"/>
<text x="86" y="1060" font-size="12" fill="#5a6b78">Error branch</text>
</g>
</svg>
