<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1360" viewBox="0 0 1180 1360" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" role="img">
<title>Credits &amp; IAP &#8212; User Flowchart</title>
<defs><marker id="fc-primary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#5a6b78" stroke-width="1.5"/></marker><marker id="fc-error" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#d6484a" stroke-width="1.5"/></marker><marker id="fc-structural" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#a8b2ba" stroke-width="1.5"/></marker><marker id="fc-deferred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#a8b2ba" stroke-width="1.5"/></marker><marker id="fc-retry" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#6cc7e6" stroke-width="1.5"/></marker></defs>
<rect width="1180" height="1360" fill="#ffffff"/>
<text x="40" y="30" font-size="17" font-weight="700" fill="#0c1c22">Credits &amp; IAP &#8212; User Flowchart</text>
<text x="40" y="50" font-size="13" fill="#5a6b78">YouCam Muse Web &#8212; desktop 1440 (D8) &#183; matches spec v1, 2026-09-01</text>
<text x="40" y="70" font-size="12" fill="#5a6b78">amber = decision &#183; green = success / resolved &#183; blue = system response &#183; red = error state</text>

<g transform="translate(0,80)">
<text x="40" y="60" font-size="12" fill="#5a6b78">Any entry point can open Subscribe or Buy Credits; the fork that matters is subscribed-or-not, not which entry point was used. Free-user and demo-flag branches hang off that same fork rather than off a separate entry.</text>
<rect x="500" y="105" width="340" height="65" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="670" y="125" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Signed in &#8212; any entry point</text>
<text x="670" y="143" font-size="12" fill="#5a6b78" text-anchor="middle">Header crown/pill &#183; sidebar &#183; Muse Pro row &#183; Credits tile &#183;</text>
<text x="670" y="158" font-size="12" fill="#5a6b78" text-anchor="middle">P1-S1, P4-S1</text>
<polygon points="590,168 813.455,200 590,232 366.545,200" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="590" y="205" font-size="13" font-weight="700" fill="#0c1c22" text-anchor="middle">Open Subscribe or Buy Credits?</text>
<line x1="670" y1="170" x2="590" y2="168" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<rect x="20" y="290" width="280" height="67" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="160" y="310" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">SubscribeModal &#8212; duration tabs, 2</text>
<text x="160" y="327" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">tiers each</text>
<text x="160" y="345" font-size="12" fill="#5a6b78" text-anchor="middle">Weekly/Monthly/Yearly x Basic/Pro &#183; P1-S2..S4</text>
<path d="M366.545 200 L333.272 200 L333.272 323.5 L300 323.5" fill="none" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="160" y="282" font-size="11" fill="#5a6b78" text-anchor="middle">Subscribe, or free user taps Buy Credits</text>
<polygon points="590,258 782.52,290 590,322 397.48,290" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="590" y="295" font-size="13" font-weight="700" fill="#0c1c22" text-anchor="middle">Buy Credits &#8212; subscribed?</text>
<path d="M813.455 200 L853.455 200 L853.455 258 L590 258" fill="none" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<text x="590" y="250" font-size="11" fill="#5a6b78" text-anchor="middle">Buy Credits tapped</text>
<path d="M397.48 290 L348.74 290 L348.74 323.5 L300 323.5" fill="none" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="160" y="282" font-size="11" fill="#5a6b78" text-anchor="middle">no (CR-06) &#8212; renders SubscribeModal, no gate screen &#183; P4-S2</text>
<rect x="830" y="290" width="280" height="82" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="970" y="310" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">BuyCreditsModal &#8212; 6 packs, default</text>
<text x="970" y="327" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">2,000</text>
<text x="970" y="345" font-size="12" fill="#5a6b78" text-anchor="middle">Discount tags shown, values not specced</text>
<text x="970" y="360" font-size="12" fill="#5a6b78" text-anchor="middle">(TBD-CR-07) &#183; P3-S1</text>
<line x1="590" y1="322" x2="970" y2="290" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="778.825" y="292.049" font-size="12" fill="#5a6b78" text-anchor="middle">yes</text>
<rect x="20" y="400" width="280" height="65" rx="8" fill="#e3f7ea" stroke="#6cc79a" stroke-width="1.5"/>
<text x="160" y="420" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">subscribe(plan) + addCredits(plan)</text>
<text x="160" y="438" font-size="12" fill="#5a6b78" text-anchor="middle">Toast &quot;Welcome to Muse Pro!&quot; &#183; P1-S5</text>
<text x="160" y="453" font-size="12" fill="#5a6b78" text-anchor="middle">(AC-CR-02)</text>
<line x1="160" y1="357" x2="160" y2="400" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="172" y="372.5" font-size="12" fill="#5a6b78" text-anchor="start">pick a card&#8217;s Subscribe</text>
<rect x="20" y="490" width="280" height="65" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="160" y="510" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Shell reflects PRO</text>
<text x="160" y="528" font-size="12" fill="#5a6b78" text-anchor="middle">Sidebar plan name, Muse Pro row, no more</text>
<text x="160" y="543" font-size="12" fill="#5a6b78" text-anchor="middle">crown &#183; P1-S6 (AC-CR-09)</text>
<line x1="160" y1="465" x2="160" y2="490" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<polygon points="240,558 424.035,590 240,622 55.9655,590" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="240" y="595" font-size="13" font-weight="700" fill="#0c1c22" text-anchor="middle">Reopen SubscribeModal?</text>
<line x1="160" y1="555" x2="240" y2="558" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<rect x="20" y="680" width="280" height="50" rx="8" fill="#e0f7fd" stroke="#6cc7e6" stroke-width="1.5"/>
<text x="160" y="700" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">&quot;You&#8217;re already on Muse Pro&quot; + Done</text>
<text x="160" y="718" font-size="12" fill="#5a6b78" text-anchor="middle">No plan cards &#8212; CR-05 &#183; P2-S1 (AC-CR-06)</text>
<line x1="240" y1="622" x2="160" y2="680" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="191.782" y="639.665" font-size="12" fill="#5a6b78" text-anchor="middle">yes</text>
<rect x="830" y="400" width="280" height="50" rx="8" fill="#e3f7ea" stroke="#6cc79a" stroke-width="1.5"/>
<text x="970" y="420" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">addCredits(pack) + toast</text>
<text x="970" y="438" font-size="12" fill="#5a6b78" text-anchor="middle">&quot;Added N credits&quot; &#183; P3-S3 (AC-CR-01)</text>
<line x1="970" y1="372" x2="970" y2="400" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="982" y="380" font-size="12" fill="#5a6b78" text-anchor="start">pick a pack, Buy Now</text>
<rect x="500" y="800" width="180" height="80" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="590" y="820" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">/profile/credits</text>
<text x="590" y="838" font-size="12" fill="#5a6b78" text-anchor="middle">Balance + All/Spend/Earn +</text>
<text x="590" y="853" font-size="12" fill="#5a6b78" text-anchor="middle">7-entry ledger &#183; P5-S1</text>
<text x="590" y="868" font-size="12" fill="#5a6b78" text-anchor="middle">(AC-CR-03)</text>
<line x1="160" y1="555" x2="590" y2="800" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="381.931" y="665.336" font-size="12" fill="#5a6b78" text-anchor="middle">Credits tile</text>
<line x1="970" y1="450" x2="590" y2="800" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="770.515" y="614.702" font-size="12" fill="#5a6b78" text-anchor="middle">Buy More CTA</text>
<polygon points="590,858 745.422,890 590,922 434.578,890" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="590" y="895" font-size="13" font-weight="700" fill="#0c1c22" text-anchor="middle">Purchase CTA label?</text>
<line x1="590" y1="880" x2="590" y2="858" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<rect x="240" y="980" width="250" height="50" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="365" y="1000" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">&quot;Buy More&quot; &#8594; BuyCreditsModal</text>
<text x="365" y="1018" font-size="12" fill="#5a6b78" text-anchor="middle">Subscriber &#183; P5-S1</text>
<path d="M434.578 890 L374.578 890 L374.578 1005 L490 1005" fill="none" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<text x="365" y="972" font-size="11" fill="#5a6b78" text-anchor="middle">subscribed</text>
<rect x="830" y="980" width="250" height="82" rx="8" fill="#e0f7fd" stroke="#6cc7e6" stroke-width="1.5"/>
<text x="955" y="1000" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">&quot;Get Muse Pro&quot; &#8594;</text>
<text x="955" y="1017" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">SubscribeModal</text>
<text x="955" y="1035" font-size="12" fill="#5a6b78" text-anchor="middle">Free user, same dialog as P4 &#183; P5-S4</text>
<text x="955" y="1050" font-size="12" fill="#5a6b78" text-anchor="middle">(AC-CR-08)</text>
<path d="M745.422 890 L787.711 890 L787.711 1021 L830 1021" fill="none" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="955" y="972" font-size="11" fill="#5a6b78" text-anchor="middle">not subscribed</text>
<rect x="20" y="1090" width="300" height="65" rx="8" fill="#fdecec" stroke="#e08a8a" stroke-width="1.5"/>
<text x="170" y="1110" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">apiError (?demo=1)</text>
<text x="170" y="1128" font-size="12" fill="#5a6b78" text-anchor="middle">&quot;Something Went Wrong&quot; + Retry, both dialogs &#183;</text>
<text x="170" y="1143" font-size="12" fill="#5a6b78" text-anchor="middle">P6-S1..S3 (AC-CR-11)</text>
<path d="M20 323.5 L-40 323.5 L-40 1090 L170 1090" fill="none" stroke="#d6484a" stroke-width="1.5" marker-end="url(#fc-error)"/>
<text x="170" y="1082" font-size="11" fill="#5a6b78" text-anchor="middle">flag on &#8212; checked once per open</text>
<path d="M1110 331 L1290 331 L1290 1090 L170 1090" fill="none" stroke="#d6484a" stroke-width="1.5" marker-end="url(#fc-error)"/>
<text x="170" y="1082" font-size="11" fill="#5a6b78" text-anchor="middle">flag on, subscriber only</text>
<rect x="830" y="1090" width="300" height="65" rx="8" fill="#fdecec" stroke="#e08a8a" stroke-width="1.5"/>
<text x="980" y="1110" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">creditsEmpty (?demo=1)</text>
<text x="980" y="1128" font-size="12" fill="#5a6b78" text-anchor="middle">&quot;No activity yet&quot;, all 3 tabs &#183; P6-S4, P6-S5</text>
<text x="980" y="1143" font-size="12" fill="#5a6b78" text-anchor="middle">(AC-CR-12)</text>
<path d="M680 840 L740 840 L740 1090 L980 1090" fill="none" stroke="#d6484a" stroke-width="1.5" marker-end="url(#fc-error)"/>
<text x="980" y="1082" font-size="11" fill="#5a6b78" text-anchor="middle">flag on</text>
<line x1="40" y1="1206" x2="1140" y2="1206" stroke="#e5e9ed" stroke-width="1"/>
<line x1="40" y1="1226" x2="74" y2="1226" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="86" y="1230" font-size="12" fill="#5a6b78">Primary happy path</text>
<line x1="40" y1="1246" x2="74" y2="1246" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<text x="86" y="1250" font-size="12" fill="#5a6b78">Structural navigation (entry, exit, close)</text>
<line x1="40" y1="1266" x2="74" y2="1266" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="86" y="1270" font-size="12" fill="#5a6b78">Deferred / reused elsewhere</text>
<line x1="40" y1="1286" x2="74" y2="1286" stroke="#d6484a" stroke-width="1.5" marker-end="url(#fc-error)"/>
<text x="86" y="1290" font-size="12" fill="#5a6b78">Error branch</text>
</g>
</svg>
