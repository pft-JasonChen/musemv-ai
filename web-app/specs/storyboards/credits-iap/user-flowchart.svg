<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1940" viewBox="0 0 1180 1940" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" role="img">
<title>Credits &amp; IAP &#8212; User Flowchart</title>
<defs><marker id="fc-primary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#5a6b78" stroke-width="1.5"/></marker><marker id="fc-error" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#d6484a" stroke-width="1.5"/></marker><marker id="fc-structural" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#a8b2ba" stroke-width="1.5"/></marker><marker id="fc-deferred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#a8b2ba" stroke-width="1.5"/></marker><marker id="fc-retry" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#6cc7e6" stroke-width="1.5"/></marker></defs>
<rect width="1180" height="1940" fill="#ffffff"/>
<text x="40" y="30" font-size="17" font-weight="700" fill="#0c1c22">Credits &amp; IAP &#8212; User Flowchart</text>
<text x="40" y="50" font-size="13" fill="#5a6b78">YouCam Muse Web &#8212; desktop 1440 (D8) &#183; matches spec v1, 2026-09-01</text>
<text x="40" y="70" font-size="12" fill="#5a6b78">amber = decision &#183; green = success / resolved &#183; blue = system response &#183; red = error state</text>

<g transform="translate(0,80)">
<text x="40" y="60" font-size="12" fill="#5a6b78">Any entry point can open Subscribe or Buy Credits; the fork that matters is subscribed-or-not, not which entry point was used.</text>
<text x="40" y="80" font-size="12" fill="#5a6b78">Free-user and demo-flag branches hang off that same fork rather than off a separate entry. One band per path.</text>
<line x1="40" y1="128" x2="1140" y2="128" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="150" font-size="15" font-weight="700" fill="#0c1c22">Part 1 &#8212; Subscribe  &#183;  P1</text>
<rect x="40" y="180" width="290" height="65" rx="20" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5"/>
<text x="185" y="200" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Signed in &#8212; any entry point</text>
<text x="185" y="218" font-size="12" fill="#5a6b78" text-anchor="middle">Header crown/pill &#183; sidebar &#183; Muse Pro row &#183;</text>
<text x="185" y="233" font-size="12" fill="#5a6b78" text-anchor="middle">Credits tile &#183; P1-S1, P4-S1</text>
<polygon points="600,268 823.455,300 600,332 376.545,300" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="600" y="305" font-size="13" font-weight="700" fill="#0c1c22" text-anchor="middle">Open Subscribe or Buy Credits?</text>
<line x1="185" y1="245" x2="600" y2="268" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<rect x="480" y="430" width="290" height="67" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="625" y="450" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">SubscribeModal &#8212; duration tabs, 2</text>
<text x="625" y="467" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">tiers each</text>
<text x="625" y="485" font-size="12" fill="#5a6b78" text-anchor="middle">Weekly/Monthly/Yearly x Basic/Pro &#183; P1-S2..S4</text>
<line x1="600" y1="332" x2="625" y2="430" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="624.5" y="375" font-size="12" fill="#5a6b78" text-anchor="start">Subscribe, or free user taps Buy Credits</text>
<rect x="480" y="560" width="290" height="65" rx="8" fill="#e3f7ea" stroke="#6cc79a" stroke-width="1.5"/>
<text x="625" y="580" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">subscribe(plan) + addCredits(plan)</text>
<text x="625" y="598" font-size="12" fill="#5a6b78" text-anchor="middle">Toast &quot;Welcome to Muse Pro!&quot; &#183; P1-S5</text>
<text x="625" y="613" font-size="12" fill="#5a6b78" text-anchor="middle">(AC-CR-02)</text>
<line x1="625" y1="497" x2="625" y2="560" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="637" y="522.5" font-size="12" fill="#5a6b78" text-anchor="start">pick a card&#8217;s Subscribe</text>
<rect x="850" y="560" width="290" height="65" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="995" y="580" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Shell reflects PRO</text>
<text x="995" y="598" font-size="12" fill="#5a6b78" text-anchor="middle">Sidebar plan name, Muse Pro row, no more</text>
<text x="995" y="613" font-size="12" fill="#5a6b78" text-anchor="middle">crown &#183; P1-S6 (AC-CR-09)</text>
<line x1="770" y1="592.5" x2="850" y2="592.5" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<line x1="40" y1="668" x2="1140" y2="668" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="690" font-size="15" font-weight="700" fill="#0c1c22">Part 2 &#8212; Reopening Subscribe once PRO  &#183;  P2</text>
<polygon points="240,718 424.035,750 240,782 55.9655,750" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="240" y="755" font-size="13" font-weight="700" fill="#0c1c22" text-anchor="middle">Reopen SubscribeModal?</text>
<rect x="480" y="720" width="290" height="50" rx="8" fill="#e0f7fd" stroke="#6cc7e6" stroke-width="1.5"/>
<text x="625" y="740" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">&quot;You&#8217;re already on Muse Pro&quot; + Done</text>
<text x="625" y="758" font-size="12" fill="#5a6b78" text-anchor="middle">No plan cards &#8212; CR-05 &#183; P2-S1 (AC-CR-06)</text>
<line x1="424.035" y1="750" x2="480" y2="745" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="450.771" y="733.556" font-size="12" fill="#5a6b78" text-anchor="middle">yes</text>
<line x1="40" y1="818" x2="1140" y2="818" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="840" font-size="15" font-weight="700" fill="#0c1c22">Parts 3 and 4 &#8212; Buy Credits, and the free-user redirect  &#183;  P3, P4</text>
<polygon points="280,868 472.52,900 280,932 87.4803,900" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="280" y="905" font-size="13" font-weight="700" fill="#0c1c22" text-anchor="middle">Buy Credits &#8212; subscribed?</text>
<rect x="850" y="870" width="290" height="82" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="995" y="890" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">BuyCreditsModal &#8212; 6 packs, default</text>
<text x="995" y="907" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">2,000</text>
<text x="995" y="925" font-size="12" fill="#5a6b78" text-anchor="middle">Discount tags shown, values not specced</text>
<text x="995" y="940" font-size="12" fill="#5a6b78" text-anchor="middle">(TBD-CR-07) &#183; P3-S1</text>
<line x1="472.52" y1="900" x2="850" y2="911" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="661.668" y="891.506" font-size="12" fill="#5a6b78" text-anchor="middle">yes</text>
<rect x="850" y="1010" width="290" height="50" rx="8" fill="#e3f7ea" stroke="#6cc79a" stroke-width="1.5"/>
<text x="995" y="1030" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">addCredits(pack) + toast</text>
<text x="995" y="1048" font-size="12" fill="#5a6b78" text-anchor="middle">&quot;Added N credits&quot; &#183; P3-S3 (AC-CR-01)</text>
<line x1="995" y1="952" x2="995" y2="1010" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="1007" y="975" font-size="12" fill="#5a6b78" text-anchor="start">pick a pack, Buy Now</text>
<rect x="480" y="1010" width="290" height="65" rx="8" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="625" y="1030" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">&#8594; Part 1: SubscribeModal</text>
<text x="625" y="1048" font-size="12" fill="#5a6b78" text-anchor="middle">CR-06 &#8212; renders it directly, no gate screen &#183;</text>
<text x="625" y="1063" font-size="12" fill="#5a6b78" text-anchor="middle">P4-S2</text>
<line x1="280" y1="932" x2="625" y2="1010" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="455.587" y="957.345" font-size="12" fill="#5a6b78" text-anchor="middle">no</text>
<line x1="40" y1="1128" x2="1140" y2="1128" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="1150" font-size="15" font-weight="700" fill="#0c1c22">Part 5 &#8212; /profile/credits  &#183;  P5</text>
<text x="40" y="1170" font-size="12" fill="#5a6b78">Reached two ways: the shell&#8217;s Credits tile (Part 1), or Buy More on the Part 3 toast.</text>
<rect x="40" y="1200" width="290" height="65" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="185" y="1220" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">/profile/credits</text>
<text x="185" y="1238" font-size="12" fill="#5a6b78" text-anchor="middle">Balance + All/Spend/Earn + 7-entry ledger &#183;</text>
<text x="185" y="1253" font-size="12" fill="#5a6b78" text-anchor="middle">P5-S1 (AC-CR-03)</text>
<polygon points="600,1268 755.422,1300 600,1332 444.578,1300" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="600" y="1305" font-size="13" font-weight="700" fill="#0c1c22" text-anchor="middle">Purchase CTA label?</text>
<line x1="185" y1="1265" x2="444.578" y2="1300" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<rect x="480" y="1400" width="290" height="50" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="625" y="1420" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">&quot;Buy More&quot; &#8594; BuyCreditsModal</text>
<text x="625" y="1438" font-size="12" fill="#5a6b78" text-anchor="middle">Subscriber &#183; P5-S1</text>
<line x1="600" y1="1332" x2="625" y2="1400" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<text x="538.5" y="1360" font-size="12" fill="#5a6b78" text-anchor="start">subscribed</text>
<rect x="850" y="1400" width="290" height="65" rx="8" fill="#e0f7fd" stroke="#6cc7e6" stroke-width="1.5"/>
<text x="995" y="1420" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">&quot;Get Muse Pro&quot; &#8594; SubscribeModal</text>
<text x="995" y="1438" font-size="12" fill="#5a6b78" text-anchor="middle">Free user, same dialog as P4 &#183; P5-S4</text>
<text x="995" y="1453" font-size="12" fill="#5a6b78" text-anchor="middle">(AC-CR-08)</text>
<line x1="600" y1="1332" x2="850" y2="1432.5" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="730.222" y="1369.26" font-size="12" fill="#5a6b78" text-anchor="middle">not subscribed</text>
<line x1="40" y1="1498" x2="1140" y2="1498" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="1520" font-size="15" font-weight="700" fill="#0c1c22">Part 6 &#8212; ?demo=1 states  &#183;  P6</text>
<rect x="40" y="1550" width="290" height="65" rx="8" fill="#fdecec" stroke="#e08a8a" stroke-width="1.5"/>
<text x="185" y="1570" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">apiError (?demo=1)</text>
<text x="185" y="1588" font-size="12" fill="#5a6b78" text-anchor="middle">&quot;Something Went Wrong&quot; + Retry, both dialogs &#183;</text>
<text x="185" y="1603" font-size="12" fill="#5a6b78" text-anchor="middle">P6-S1..S3 (AC-CR-11)</text>
<rect x="480" y="1550" width="290" height="65" rx="8" fill="#fdecec" stroke="#e08a8a" stroke-width="1.5"/>
<text x="625" y="1570" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">creditsEmpty (?demo=1)</text>
<text x="625" y="1588" font-size="12" fill="#5a6b78" text-anchor="middle">&quot;No activity yet&quot;, all 3 tabs &#183; P6-S4, P6-S5</text>
<text x="625" y="1603" font-size="12" fill="#5a6b78" text-anchor="middle">(AC-CR-12)</text>
<text x="40" y="1670" font-size="12" fill="#5a6b78">apiError is checked once per dialog OPEN, on both Subscribe and Buy Credits; creditsEmpty applies to /profile/credits only.</text>
<text x="40" y="1690" font-size="12" fill="#5a6b78">?demo=1 changes what a screen renders, never how it is reached &#8212; which is why neither has an entry edge of its own.</text>
<line x1="40" y1="1736" x2="1140" y2="1736" stroke="#e5e9ed" stroke-width="1"/>
<line x1="40" y1="1756" x2="74" y2="1756" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="86" y="1760" font-size="12" fill="#5a6b78">Primary happy path</text>
<line x1="40" y1="1776" x2="74" y2="1776" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="86" y="1780" font-size="12" fill="#5a6b78">Deferred / reused elsewhere</text>
<line x1="40" y1="1796" x2="74" y2="1796" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<text x="86" y="1800" font-size="12" fill="#5a6b78">Structural navigation (entry, exit, close)</text>
</g>
</svg>
