<text x="920" y="535" font-size="12" fill="#5a6b78" text-anchor="middle">Same dirty-gate, same cost &#183;</text>
<text x="920" y="550" font-size="12" fill="#5a6b78" text-anchor="middle">P3-S5..S8 (D8, A16)</text>
