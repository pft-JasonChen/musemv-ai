<text x="456.952" y="527.336" font-size="12" fill="#5a6b78" text-anchor="middle">yes</text>
<rect x="830" y="480" width="180" height="82" rx="8" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="920" y="500" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Phone: full-screen</text>
