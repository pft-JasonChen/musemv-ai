<text x="330" y="417" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">undo</text>
<text x="330" y="435" font-size="12" fill="#5a6b78" text-anchor="middle">Flat 4 credits &#183; P2-S3, P2-S4</text>
<text x="330" y="450" font-size="12" fill="#5a6b78" text-anchor="middle">(AC-MV-12)</text>
