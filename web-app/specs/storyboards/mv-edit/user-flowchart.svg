<text x="920" y="797" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">flow -&gt; /history</text>
<text x="920" y="815" font-size="12" fill="#5a6b78" text-anchor="middle">No backend delete &#183; P4-S3</text>
