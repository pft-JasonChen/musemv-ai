<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1650" viewBox="0 0 1180 1650" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" role="img">
<title>AI Music Video Edit &#8212; User Flowchart</title>
<defs><marker id="fc-primary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#5a6b78" stroke-width="1.5"/></marker><marker id="fc-error" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#d6484a" stroke-width="1.5"/></marker><marker id="fc-structural" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#a8b2ba" stroke-width="1.5"/></marker><marker id="fc-deferred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#a8b2ba" stroke-width="1.5"/></marker><marker id="fc-retry" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#6cc7e6" stroke-width="1.5"/></marker></defs>
<rect width="1180" height="1650" fill="#ffffff"/>
<text x="40" y="30" font-size="17" font-weight="700" fill="#0c1c22">AI Music Video Edit &#8212; User Flowchart</text>
<text x="40" y="50" font-size="13" fill="#5a6b78">YouCam Muse Web &#8212; desktop 1403×697 AND phone 375×812 (D8 exception) &#183; matches spec v1, 2026-08-28</text>
<text x="40" y="70" font-size="12" fill="#5a6b78">red = error state &#183; amber = decision &#183; green = success / resolved</text>

<g transform="translate(0,80)">
<text x="40" y="65" font-size="12" fill="#5a6b78">Five branches off one entry point, not a sequence &#8212; a visit touches whichever sections it touches before Merge or Delete or leaving. Every &quot;opened, stop&quot; node is another spec's territory (S2/S4); this diagram does not draw past it.</text>
<rect x="500" y="100" width="180" height="80" rx="20" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5"/>
<text x="590" y="120" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">/mv/edit</text>
<text x="590" y="138" font-size="12" fill="#5a6b78" text-anchor="middle">Real entry (Result) or</text>
<text x="590" y="153" font-size="12" fill="#5a6b78" text-anchor="middle">fabricated (History) &#183;</text>
<text x="590" y="168" font-size="12" fill="#5a6b78" text-anchor="middle">P1-S1..S5</text>
<rect x="20" y="100" width="180" height="65" rx="8" fill="#fdecec" stroke="#e08a8a" stroke-width="1.5"/>
<text x="110" y="120" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Reload, no flow state</text>
<text x="110" y="138" font-size="12" fill="#5a6b78" text-anchor="middle">router.replace(/mv/room) &#183;</text>
<text x="110" y="153" font-size="12" fill="#5a6b78" text-anchor="middle">P5-S4 (MV-E2)</text>
<path d="M500 140 L440 140 L440 132.5 L200 132.5" fill="none" stroke="#d6484a" stroke-width="1.5" marker-end="url(#fc-error)"/>
<text x="110" y="92" font-size="11" fill="#5a6b78" text-anchor="middle">no storyboard</text>
<rect x="500" y="190" width="180" height="82" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="590" y="210" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Header + three</text>
<text x="590" y="227" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">sections render</text>
<text x="590" y="245" font-size="12" fill="#5a6b78" text-anchor="middle">Cover &#183; Scenes &#183; Output</text>
<text x="590" y="260" font-size="12" fill="#5a6b78" text-anchor="middle">settings &#183; P1-S2, P1-S3</text>
