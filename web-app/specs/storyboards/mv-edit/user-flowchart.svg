<text x="456.952" y="337.336" font-size="12" fill="#5a6b78" text-anchor="middle">yes</text>
<polygon points="590,448 770.571,480 590,512 409.429,480" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="590" y="485" font-size="13" font-weight="700" fill="#0c1c22" text-anchor="middle">Edit + Recreate a scene?</text>
