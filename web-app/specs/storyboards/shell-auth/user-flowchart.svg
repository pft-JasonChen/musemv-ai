<text x="720" y="597" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">now renders</text>
<text x="720" y="615" font-size="12" fill="#5a6b78" text-anchor="middle">No separate navigation &#183;</text>
<text x="720" y="630" font-size="12" fill="#5a6b78" text-anchor="middle">P4-S3</text>
