<text x="330" y="317" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">state updates</text>
<text x="330" y="335" font-size="12" fill="#5a6b78" text-anchor="middle">Locale prefix preserved &#183;</text>
<text x="330" y="350" font-size="12" fill="#5a6b78" text-anchor="middle">P1-S2, P1-S3</text>
<line x1="590" y1="222" x2="330" y2="280" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="456.952" y="237.336" font-size="12" fill="#5a6b78" text-anchor="middle">signed in, item</text>
<rect x="800" y="280" width="180" height="82" rx="8" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="890" y="300" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">&quot;+&quot; create sheet</text>
<text x="890" y="317" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">(phone)</text>
<text x="890" y="335" font-size="12" fill="#5a6b78" text-anchor="middle">AI Music Video / AI Song,</text>
<text x="890" y="350" font-size="12" fill="#5a6b78" text-anchor="middle">ungated &#183; P1-S5, P1-S6</text>
