<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="2200" viewBox="0 0 1180 2200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" role="img">
<title>Shell &amp; Auth &#8212; User Flowchart</title>
<defs><marker id="fc-primary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#5a6b78" stroke-width="1.5"/></marker><marker id="fc-error" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#d6484a" stroke-width="1.5"/></marker><marker id="fc-structural" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#a8b2ba" stroke-width="1.5"/></marker><marker id="fc-deferred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#a8b2ba" stroke-width="1.5"/></marker><marker id="fc-retry" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#6cc7e6" stroke-width="1.5"/></marker></defs>
<rect width="1180" height="2200" fill="#ffffff"/>
<text x="40" y="30" font-size="17" font-weight="700" fill="#0c1c22">Shell &amp; Auth &#8212; User Flowchart</text>
<text x="40" y="50" font-size="13" fill="#5a6b78">YouCam Muse Web &#8212; desktop 1403×697 AND phone 375×812 (D8 exception) &#183; matches spec v1, 2026-08-27</text>
<text x="40" y="70" font-size="12" fill="#5a6b78">amber = decision &#183; red = error state &#183; green = success / resolved &#183; blue = system response</text>

<g transform="translate(0,80)">
<text x="40" y="65" font-size="12" fill="#5a6b78">Seven branches off one entry point, not a sequence &#8212; a visit hits exactly one. Every &quot;opened, stop&quot; node is</text>
<text x="40" y="85" font-size="12" fill="#5a6b78">another spec&#8217;s territory (S5/S7); this diagram does not draw past it. One band per path.</text>
<line x1="40" y1="128" x2="1140" y2="128" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="150" font-size="15" font-weight="700" fill="#0c1c22">Part 1 &#8212; Navigating the shell  &#183;  P1</text>
<rect x="40" y="180" width="310" height="50" rx="20" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5"/>
<text x="195" y="200" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Any route</text>
<text x="195" y="218" font-size="12" fill="#5a6b78" text-anchor="middle">Signed in or not &#183; P1-S1</text>
<polygon points="600,268 692,300 600,332 508,300" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="600" y="305" font-size="13" font-weight="700" fill="#0c1c22" text-anchor="middle">Nav click?</text>
<line x1="195" y1="230" x2="600" y2="268" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<rect x="40" y="400" width="310" height="50" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="195" y="420" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Route changes, active state updates</text>
<text x="195" y="438" font-size="12" fill="#5a6b78" text-anchor="middle">Locale prefix preserved &#183; P1-S2, P1-S3</text>
<line x1="600" y1="332" x2="195" y2="400" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="395.182" y="352.193" font-size="12" fill="#5a6b78" text-anchor="middle">signed in, item</text>
<rect x="830" y="400" width="310" height="50" rx="8" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="985" y="420" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">&quot;+&quot; create sheet (phone)</text>
<text x="985" y="438" font-size="12" fill="#5a6b78" text-anchor="middle">AI Music Video / AI Song, ungated &#183; P1-S5, P1-S6</text>
<line x1="600" y1="332" x2="985" y2="400" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="794.935" y="352.213" font-size="12" fill="#5a6b78" text-anchor="middle">phone tab bar</text>
<line x1="40" y1="478" x2="1140" y2="478" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="500" font-size="15" font-weight="700" fill="#0c1c22">Part 2 &#8212; A guest clicks History  &#183;  P2</text>
<text x="40" y="520" font-size="12" fill="#5a6b78">Reached from Part 1&#8217;s nav click while logged out. History is the only gated nav item.</text>
<polygon points="240,548 393.85,580 240,612 86.1501,580" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="240" y="585" font-size="13" font-weight="700" fill="#0c1c22" text-anchor="middle">Guest clicks History?</text>
<rect x="830" y="550" width="310" height="50" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="985" y="570" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">SignInModal, /history queued</text>
<text x="985" y="588" font-size="12" fill="#5a6b78" text-anchor="middle">Sidebar or MobileTabBar &#183; P2-S1, P2-S4</text>
<line x1="393.85" y1="580" x2="830" y2="575" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="611.764" y="563.501" font-size="12" fill="#5a6b78" text-anchor="middle">sidebar / tab bar</text>
<rect x="470" y="660" width="310" height="50" rx="8" fill="#fdecec" stroke="#e08a8a" stroke-width="1.5"/>
<text x="625" y="680" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Dismiss &#8594; stay put</text>
<text x="625" y="698" font-size="12" fill="#5a6b78" text-anchor="middle">No redirect &#183; P2-S2, P2-S5</text>
<line x1="985" y1="600" x2="780" y2="685" stroke="#d6484a" stroke-width="1.5" marker-end="url(#fc-error)"/>
<text x="877.138" y="629.568" font-size="12" fill="#5a6b78" text-anchor="middle">dismiss</text>
<rect x="830" y="660" width="310" height="50" rx="8" fill="#e3f7ea" stroke="#6cc79a" stroke-width="1.5"/>
<text x="985" y="680" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Sign in &#8594; lands on /history</text>
<text x="985" y="698" font-size="12" fill="#5a6b78" text-anchor="middle">Queued nav runs &#183; P2-S3</text>
<line x1="985" y1="600" x2="985" y2="660" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="997" y="624" font-size="12" fill="#5a6b78" text-anchor="start">sign in</text>
<line x1="40" y1="738" x2="1140" y2="738" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="760" font-size="15" font-weight="700" fill="#0c1c22">Part 4 &#8212; Direct URL to a gated route (AuthGuard)  &#183;  P4</text>
<rect x="40" y="790" width="310" height="50" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="195" y="810" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Direct URL: /history /profile /settings</text>
<text x="195" y="828" font-size="12" fill="#5a6b78" text-anchor="middle">Guest &#183; P4-S1</text>
<rect x="470" y="790" width="310" height="67" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="625" y="810" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">AuthGuard: renders nothing, SignInModal</text>
<text x="625" y="827" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">opens</text>
<text x="625" y="845" font-size="12" fill="#5a6b78" text-anchor="middle">No queued action &#183; P4-S1</text>
<line x1="350" y1="815" x2="470" y2="823.5" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<rect x="40" y="920" width="310" height="50" rx="8" fill="#fdecec" stroke="#e08a8a" stroke-width="1.5"/>
<text x="195" y="940" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Dismiss &#8594; router.replace(home)</text>
<text x="195" y="958" font-size="12" fill="#5a6b78" text-anchor="middle">Opposite of P2&#8217;s dismiss &#183; P4-S2</text>
<line x1="625" y1="857" x2="195" y2="920" stroke="#d6484a" stroke-width="1.5" marker-end="url(#fc-error)"/>
<text x="407.971" y="874.648" font-size="12" fill="#5a6b78" text-anchor="middle">dismiss</text>
<rect x="470" y="920" width="310" height="50" rx="8" fill="#e3f7ea" stroke="#6cc79a" stroke-width="1.5"/>
<text x="625" y="940" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Sign in &#8594; SAME url now renders</text>
<text x="625" y="958" font-size="12" fill="#5a6b78" text-anchor="middle">No separate navigation &#183; P4-S3</text>
<line x1="625" y1="857" x2="625" y2="920" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="637" y="882.5" font-size="12" fill="#5a6b78" text-anchor="start">sign in</text>
<line x1="40" y1="998" x2="1140" y2="998" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="1020" font-size="15" font-weight="700" fill="#0c1c22">Part 3 &#8212; Header Login, no queued action  &#183;  P3</text>
<rect x="40" y="1050" width="310" height="50" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="195" y="1070" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">&quot;Login&quot; button (own-chrome route)</text>
<text x="195" y="1088" font-size="12" fill="#5a6b78" text-anchor="middle">RoomNavbar / DetailNavbar / Navbar &#183; P3-S1</text>
<rect x="470" y="1050" width="310" height="50" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="625" y="1070" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">SignInModal, no queued action</text>
<text x="625" y="1088" font-size="12" fill="#5a6b78" text-anchor="middle">P3-S1</text>
<line x1="350" y1="1075" x2="470" y2="1075" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<rect x="470" y="1170" width="310" height="50" rx="8" fill="#e3f7ea" stroke="#6cc79a" stroke-width="1.5"/>
<text x="625" y="1190" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Same page, logged-in cluster</text>
<text x="625" y="1208" font-size="12" fill="#5a6b78" text-anchor="middle">Credit pill + Upgrade (if !subscribed) &#183; P3-S2</text>
<line x1="625" y1="1100" x2="625" y2="1170" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="637" y="1129" font-size="12" fill="#5a6b78" text-anchor="start">sign in</text>
<line x1="40" y1="1268" x2="1140" y2="1268" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="1290" font-size="15" font-weight="700" fill="#0c1c22">Part 5 &#8212; Account entry points  &#183;  P5</text>
<polygon points="240,1318 367.602,1350 240,1382 112.398,1350" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="240" y="1355" font-size="13" font-weight="700" fill="#0c1c22" text-anchor="middle">Account control?</text>
<rect x="470" y="1320" width="310" height="50" rx="8" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="625" y="1340" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Credit pill &#8594; &quot;Upgrade Your Plan&quot;</text>
<text x="625" y="1358" font-size="12" fill="#5a6b78" text-anchor="middle">S5&#8217;s territory &#183; P5-S1</text>
<line x1="367.602" y1="1350" x2="470" y2="1345" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="418.118" y="1333.52" font-size="12" fill="#5a6b78" text-anchor="middle">credit pill</text>
<rect x="830" y="1440" width="310" height="50" rx="8" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="985" y="1460" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Sidebar footer &#8594; /profile</text>
<text x="985" y="1478" font-size="12" fill="#5a6b78" text-anchor="middle">S7&#8217;s territory &#183; P5-S2, P5-S4</text>
<line x1="240" y1="1382" x2="830" y2="1465" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="536.95" y="1409.64" font-size="12" fill="#5a6b78" text-anchor="middle">profile footer</text>
<rect x="40" y="1470" width="310" height="50" rx="8" fill="#fdecec" stroke="#e08a8a" stroke-width="1.5"/>
<text x="195" y="1490" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">No menu exists</text>
<text x="195" y="1508" font-size="12" fill="#5a6b78" text-anchor="middle">DOM-swept, 5 routes &#183; P5-S3</text>
<line x1="240" y1="1382" x2="195" y2="1470" stroke="#d6484a" stroke-width="1.5" marker-end="url(#fc-error)"/>
<text x="229.5" y="1420" font-size="12" fill="#5a6b78" text-anchor="start">avatar / menu?</text>
<line x1="40" y1="1568" x2="1140" y2="1568" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="1590" font-size="15" font-weight="700" fill="#0c1c22">Part 6 &#8212; Sign Out and the reload reset  &#183;  P6</text>
<rect x="40" y="1620" width="310" height="50" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="195" y="1640" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Settings &#8594; Sign Out</text>
<text x="195" y="1658" font-size="12" fill="#5a6b78" text-anchor="middle">Only reachable entry point &#183; P6-S1</text>
<rect x="470" y="1620" width="310" height="50" rx="8" fill="#e3f7ea" stroke="#6cc79a" stroke-width="1.5"/>
<text x="625" y="1640" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Guest chrome, routed Home</text>
<text x="625" y="1658" font-size="12" fill="#5a6b78" text-anchor="middle">P6-S2</text>
<line x1="350" y1="1645" x2="470" y2="1645" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<rect x="830" y="1620" width="310" height="50" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="985" y="1640" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Sign back in + subscribe</text>
<text x="985" y="1658" font-size="12" fill="#5a6b78" text-anchor="middle">P6-S3</text>
<line x1="780" y1="1645" x2="830" y2="1645" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<rect x="830" y="1730" width="310" height="65" rx="8" fill="#e0f7fd" stroke="#6cc7e6" stroke-width="1.5"/>
<text x="985" y="1750" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Full reload</text>
<text x="985" y="1768" font-size="12" fill="#5a6b78" text-anchor="middle">loggedIn persists, subscribed/profile reset &#183; P6-S4</text>
<text x="985" y="1783" font-size="12" fill="#5a6b78" text-anchor="middle">(AUTH-E1)</text>
<line x1="985" y1="1670" x2="985" y2="1730" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<line x1="40" y1="1838" x2="1140" y2="1838" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="1860" font-size="15" font-weight="700" fill="#0c1c22">Part 7 &#8212; A path that starts /share  &#183;  P7</text>
<rect x="40" y="1890" width="310" height="50" rx="8" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="195" y="1910" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">/share…</text>
<text x="195" y="1928" font-size="12" fill="#5a6b78" text-anchor="middle">No sidebar, no top bar &#183; P7-S1</text>
<text x="470" y="1915" font-size="12" fill="#5a6b78">The shell draws no chrome at all &#8212; S9 owns everything on that page.</text>
<line x1="40" y1="1996" x2="1140" y2="1996" stroke="#e5e9ed" stroke-width="1"/>
<line x1="40" y1="2016" x2="74" y2="2016" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="86" y="2020" font-size="12" fill="#5a6b78">Primary happy path</text>
<line x1="40" y1="2036" x2="74" y2="2036" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="86" y="2040" font-size="12" fill="#5a6b78">Deferred / reused elsewhere</text>
<line x1="40" y1="2056" x2="74" y2="2056" stroke="#d6484a" stroke-width="1.5" marker-end="url(#fc-error)"/>
<text x="86" y="2060" font-size="12" fill="#5a6b78">Error branch</text>
</g>
</svg>
