<text x="330" y="507" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">queued</text>
<text x="330" y="525" font-size="12" fill="#5a6b78" text-anchor="middle">Sidebar or MobileTabBar &#183;</text>
<text x="330" y="540" font-size="12" fill="#5a6b78" text-anchor="middle">P2-S1, P2-S4</text>
