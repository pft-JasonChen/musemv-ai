<text x="590" y="120" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Any route</text>
<text x="590" y="138" font-size="12" fill="#5a6b78" text-anchor="middle">Signed in or not &#183; P1-S1</text>
<polygon points="590,158 682,190 590,222 498,190" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
