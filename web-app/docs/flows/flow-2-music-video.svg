<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="1540" viewBox="0 0 1140 1540" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" role="img">
<title>2. AI Music Video &#8212; User Flowchart</title>
<desc>Composing an MV, the two generation routes, and editing the result.</desc>
<defs><marker id="fc-primary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#5a6b78" stroke-width="1.5"/></marker><marker id="fc-error" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#d6484a" stroke-width="1.5"/></marker><marker id="fc-structural" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#a8b2ba" stroke-width="1.5"/></marker><marker id="fc-deferred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#a8b2ba" stroke-width="1.5"/></marker><marker id="fc-retry" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#6cc7e6" stroke-width="1.5"/></marker></defs>
<rect width="1140" height="1540" fill="#ffffff"/>
<text x="40" y="30" font-size="17" font-weight="700" fill="#0c1c22">2. AI Music Video &#8212; User Flowchart</text>
<text x="40" y="50" font-size="13" fill="#5a6b78">YouCam Muse Web (desktop 1440 / phone 375) &#183; matches spec V1, 2026-08-19</text>
<text x="40" y="70" font-size="12" fill="#5a6b78">amber = decision &#183; red = error state &#183; blue = system response &#183; green = success / resolved</text>

<g transform="translate(0,80)">
<line x1="40" y1="2" x2="1100" y2="2" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="24" font-size="15" font-weight="700" fill="#0c1c22">Compose  &#183;  /mv/room</text>
<rect x="472" y="44" width="196" height="50" rx="20" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5"/>
<text x="570" y="64" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">/mv/room</text>
<text x="570" y="82" font-size="12" fill="#5a6b78" text-anchor="middle">guest-reachable &#183; MV-P1</text>
<rect x="50" y="128" width="196" height="65" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="148" y="148" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Choose a song</text>
<text x="148" y="166" font-size="12" fill="#5a6b78" text-anchor="middle">library / sample / import &#183;</text>
<text x="148" y="181" font-size="12" fill="#5a6b78" text-anchor="middle">MV-P6-A/B</text>
<rect x="50" y="208" width="196" height="50" rx="8" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="148" y="228" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Trim audio</text>
<text x="148" y="246" font-size="12" fill="#5a6b78" text-anchor="middle">30s minimum &#183; AC-MV-16</text>
<line x1="472" y1="69" x2="148" y2="128" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<line x1="148" y1="193" x2="148" y2="208" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="160" y="194.5" font-size="12" fill="#5a6b78" text-anchor="start">every source</text>
<rect x="890" y="128" width="196" height="65" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="988" y="148" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Describe the video</text>
<text x="988" y="166" font-size="12" fill="#5a6b78" text-anchor="middle">2500 chars, Enhance is free &#183;</text>
<text x="988" y="181" font-size="12" fill="#5a6b78" text-anchor="middle">AC-MV-03</text>
<rect x="890" y="208" width="196" height="65" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="988" y="228" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Character photos</text>
<text x="988" y="246" font-size="12" fill="#5a6b78" text-anchor="middle">up to 2, consent on first upload &#183;</text>
<text x="988" y="261" font-size="12" fill="#5a6b78" text-anchor="middle">MV-P1-S5</text>
<line x1="668" y1="69" x2="988" y2="128" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<line x1="988" y1="193" x2="988" y2="208" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<polygon points="570,264 717.326,296 570,328 422.674,296" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="570" y="294" font-size="13" font-weight="700" fill="#0c1c22" text-anchor="middle">Song + description?</text>
<text x="570" y="311" font-size="11" fill="#5a6b78" text-anchor="middle">AC-MV-01</text>
<line x1="148" y1="258" x2="422.674" y2="296" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<line x1="988" y1="273" x2="717.326" y2="296" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<line x1="40" y1="338" x2="1100" y2="338" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="360" font-size="15" font-weight="700" fill="#0c1c22">Choose how to generate</text>
<rect x="472" y="380" width="196" height="65" rx="8" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="570" y="400" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Mode dialog</text>
<text x="570" y="418" font-size="12" fill="#5a6b78" text-anchor="middle">price shown = price charged &#183;</text>
<text x="570" y="433" font-size="12" fill="#5a6b78" text-anchor="middle">spec 11</text>
<line x1="570" y1="328" x2="570" y2="380" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="582" y="348" font-size="12" fill="#5a6b78" text-anchor="start">enabled</text>
<rect x="890" y="380" width="196" height="50" rx="8" fill="#fdecec" stroke="#e08a8a" stroke-width="1.5"/>
<text x="988" y="400" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Not enough credits</text>
<text x="988" y="418" font-size="12" fill="#5a6b78" text-anchor="middle">-&gt; Buy credits &#183; AC-CR-07</text>
<line x1="668" y1="412.5" x2="890" y2="405" stroke="#d6484a" stroke-width="1.5" marker-end="url(#fc-error)"/>
<rect x="50" y="470" width="196" height="50" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="148" y="490" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Storyboard first</text>
<text x="148" y="508" font-size="12" fill="#5a6b78" text-anchor="middle">12 / 15 / 18 by song length &#183; 3.3</text>
<rect x="890" y="470" width="196" height="50" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="988" y="490" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Create directly</text>
<text x="988" y="508" font-size="12" fill="#5a6b78" text-anchor="middle">45 + per-second &#183; 3.2</text>
<line x1="472" y1="412.5" x2="148" y2="470" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<line x1="668" y1="412.5" x2="988" y2="470" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<rect x="50" y="550" width="196" height="65" rx="8" fill="#e0f7fd" stroke="#6cc7e6" stroke-width="1.5"/>
<text x="148" y="570" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">/mv/thinking</text>
<text x="148" y="588" font-size="12" fill="#5a6b78" text-anchor="middle">~1 min, charged at start &#183;</text>
<text x="148" y="603" font-size="12" fill="#5a6b78" text-anchor="middle">MV-P2-S2</text>
<rect x="50" y="630" width="196" height="50" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="148" y="650" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">/mv/storyboard</text>
<text x="148" y="668" font-size="12" fill="#5a6b78" text-anchor="middle">edit style + scenes &#183; MV-P2-S3</text>
<line x1="148" y1="520" x2="148" y2="550" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<line x1="148" y1="615" x2="148" y2="630" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<rect x="50" y="710" width="196" height="50" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="148" y="730" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Generate MV</text>
<text x="148" y="748" font-size="12" fill="#5a6b78" text-anchor="middle">35 + per-second &#183; 3.4</text>
<line x1="148" y1="680" x2="148" y2="710" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<line x1="40" y1="768" x2="1100" y2="768" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="790" font-size="15" font-weight="700" fill="#0c1c22">Render and result</text>
<rect x="472" y="810" width="196" height="50" rx="8" fill="#e0f7fd" stroke="#6cc7e6" stroke-width="1.5"/>
<text x="570" y="830" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">/mv/creating</text>
<text x="570" y="848" font-size="12" fill="#5a6b78" text-anchor="middle">~2 min &#183; MV-P3-S2</text>
<line x1="148" y1="760" x2="472" y2="835" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<line x1="988" y1="520" x2="668" y2="835" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<rect x="890" y="810" width="196" height="50" rx="8" fill="#fdecec" stroke="#e08a8a" stroke-width="1.5"/>
<text x="988" y="830" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Job failed</text>
<text x="988" y="848" font-size="12" fill="#5a6b78" text-anchor="middle">credits refunded in full &#183; 5.2</text>
<line x1="668" y1="835" x2="890" y2="835" stroke="#d6484a" stroke-width="1.5" marker-end="url(#fc-error)"/>
<line x1="988" y1="810" x2="570" y2="810" stroke="#6cc7e6" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#fc-retry)"/>
<text x="779" y="804" font-size="12" fill="#5a6b78" text-anchor="middle">Retry</text>
<rect x="472" y="900" width="196" height="65" rx="8" fill="#e3f7ea" stroke="#6cc79a" stroke-width="1.5"/>
<text x="570" y="920" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">/mv/result</text>
<text x="570" y="938" font-size="12" fill="#5a6b78" text-anchor="middle">play, like, share, download &#183;</text>
<text x="570" y="953" font-size="12" fill="#5a6b78" text-anchor="middle">MV-P4</text>
<line x1="570" y1="860" x2="570" y2="900" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="582" y="874" font-size="12" fill="#5a6b78" text-anchor="start">done</text>
<line x1="40" y1="958" x2="1100" y2="958" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="980" font-size="15" font-weight="700" fill="#0c1c22">Edit  &#183;  /mv/edit</text>
<rect x="472" y="1000" width="196" height="65" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="570" y="1020" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">/mv/edit</text>
<text x="570" y="1038" font-size="12" fill="#5a6b78" text-anchor="middle">no Save &#8212; edits are in-memory</text>
<text x="570" y="1053" font-size="12" fill="#5a6b78" text-anchor="middle">&#183; MV-P5</text>
<line x1="570" y1="965" x2="570" y2="1000" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="582" y="976.5" font-size="12" fill="#5a6b78" text-anchor="start">Edit MV</text>
<rect x="50" y="1080" width="196" height="50" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="148" y="1100" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Recreate one shot</text>
<text x="148" y="1118" font-size="12" fill="#5a6b78" text-anchor="middle">8 + per-second, per shot &#183; 3.5</text>
<rect x="890" y="1080" width="196" height="50" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="988" y="1100" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Recreate cover</text>
<text x="988" y="1118" font-size="12" fill="#5a6b78" text-anchor="middle">4 per result &#183; 6.1</text>
<line x1="472" y1="1032.5" x2="148" y2="1080" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<line x1="668" y1="1032.5" x2="988" y2="1080" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<rect x="472" y="1160" width="196" height="50" rx="8" fill="#e3f7ea" stroke="#6cc79a" stroke-width="1.5"/>
<text x="570" y="1180" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Merge MV</text>
<text x="570" y="1198" font-size="12" fill="#5a6b78" text-anchor="middle">flat 10 &#183; 3.6</text>
<line x1="148" y1="1130" x2="472" y2="1185" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<line x1="988" y1="1130" x2="668" y2="1185" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<path d="M472 1185 L438 1185 L438 835 L472 835" fill="none" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="430" y="1010" font-size="11" fill="#5a6b78" text-anchor="end">re-renders</text>
<text x="50" y="1250" font-size="12" fill="#5a6b78">Every price above comes from specs/areas/11-credit-consumption.md and is computed at run time &#8212; it changes with song length, MV type and resolution.</text>
<text x="50" y="1268" font-size="12" fill="#5a6b78">Charging happens when the job STARTS, and a failed job refunds in full. Published MVs must be unpublished before they can be edited (MV-E7).</text>
<line x1="40" y1="1296" x2="1100" y2="1296" stroke="#e5e9ed" stroke-width="1"/>
<line x1="40" y1="1316" x2="74" y2="1316" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<text x="86" y="1320" font-size="12" fill="#5a6b78">Structural navigation (entry, exit, close)</text>
<line x1="40" y1="1336" x2="74" y2="1336" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="86" y="1340" font-size="12" fill="#5a6b78">Primary happy path</text>
<line x1="40" y1="1356" x2="74" y2="1356" stroke="#d6484a" stroke-width="1.5" marker-end="url(#fc-error)"/>
<text x="86" y="1360" font-size="12" fill="#5a6b78">Error branch</text>
<line x1="40" y1="1376" x2="74" y2="1376" stroke="#6cc7e6" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#fc-retry)"/>
<text x="86" y="1380" font-size="12" fill="#5a6b78">Retry loop</text>
<line x1="40" y1="1396" x2="74" y2="1396" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="86" y="1400" font-size="12" fill="#5a6b78">Deferred / reused elsewhere</text>
</g>
</svg>
