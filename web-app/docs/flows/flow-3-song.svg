<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="960" viewBox="0 0 1020 960" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" role="img">
<title>3. AI Song &#8212; User Flowchart</title>
<desc>Creating a song and what can be done with the result.</desc>
<defs><marker id="fc-primary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#5a6b78" stroke-width="1.5"/></marker><marker id="fc-error" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#d6484a" stroke-width="1.5"/></marker><marker id="fc-structural" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#a8b2ba" stroke-width="1.5"/></marker><marker id="fc-deferred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#a8b2ba" stroke-width="1.5"/></marker><marker id="fc-retry" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#6cc7e6" stroke-width="1.5"/></marker></defs>
<rect width="1020" height="960" fill="#ffffff"/>
<text x="40" y="30" font-size="17" font-weight="700" fill="#0c1c22">3. AI Song &#8212; User Flowchart</text>
<text x="40" y="50" font-size="13" fill="#5a6b78">YouCam Muse Web (desktop 1440 / phone 375) &#183; matches spec V1, 2026-08-19</text>
<text x="40" y="70" font-size="12" fill="#5a6b78">amber = decision &#183; red = error state &#183; blue = system response &#183; green = success / resolved</text>

<g transform="translate(0,80)">
<line x1="40" y1="2" x2="980" y2="2" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="24" font-size="15" font-weight="700" fill="#0c1c22">Compose  &#183;  /song/create</text>
<rect x="412" y="44" width="196" height="50" rx="20" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5"/>
<text x="510" y="64" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">/song/create</text>
<text x="510" y="82" font-size="12" fill="#5a6b78" text-anchor="middle">guest-reachable &#183; SONG-E3</text>
<rect x="44" y="130" width="196" height="65" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="142" y="150" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Simple mode</text>
<text x="142" y="168" font-size="12" fill="#5a6b78" text-anchor="middle">one describe box &#183;</text>
<text x="142" y="183" font-size="12" fill="#5a6b78" text-anchor="middle">AC-SONG-01</text>
<rect x="780" y="130" width="196" height="50" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="878" y="150" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Custom mode</text>
<text x="878" y="168" font-size="12" fill="#5a6b78" text-anchor="middle">lyrics + genre / mood / vocal</text>
<line x1="412" y1="69" x2="142" y2="130" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="277" y="93.5" font-size="12" fill="#5a6b78" text-anchor="middle">default</text>
<line x1="608" y1="69" x2="878" y2="130" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<polygon points="510,192 618.267,224 510,256 401.733,224" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="510" y="222" font-size="13" font-weight="700" fill="#0c1c22" text-anchor="middle">Instrumental?</text>
<text x="510" y="239" font-size="11" fill="#5a6b78" text-anchor="middle">AC-SONG-02</text>
<line x1="142" y1="195" x2="401.733" y2="224" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<line x1="878" y1="180" x2="618.267" y2="224" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<rect x="412" y="280" width="196" height="50" rx="8" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="510" y="300" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Create Song</text>
<text x="510" y="318" font-size="12" fill="#5a6b78" text-anchor="middle">6 vocal / 12 instrumental &#183; 3.1</text>
<line x1="510" y1="256" x2="510" y2="280" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<rect x="780" y="280" width="196" height="50" rx="8" fill="#fdecec" stroke="#e08a8a" stroke-width="1.5"/>
<text x="878" y="300" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Not enough credits</text>
<text x="878" y="318" font-size="12" fill="#5a6b78" text-anchor="middle">-&gt; Buy credits &#183; GL-01</text>
<line x1="608" y1="305" x2="780" y2="305" stroke="#d6484a" stroke-width="1.5" marker-end="url(#fc-error)"/>
<line x1="40" y1="338" x2="980" y2="338" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="360" font-size="15" font-weight="700" fill="#0c1c22">Generate</text>
<rect x="412" y="380" width="196" height="50" rx="8" fill="#e0f7fd" stroke="#6cc7e6" stroke-width="1.5"/>
<text x="510" y="400" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">/song/creating</text>
<text x="510" y="418" font-size="12" fill="#5a6b78" text-anchor="middle">charged at start &#183; AC-SONG-05</text>
<line x1="510" y1="330" x2="510" y2="380" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<rect x="780" y="380" width="196" height="50" rx="8" fill="#fdecec" stroke="#e08a8a" stroke-width="1.5"/>
<text x="878" y="400" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Job failed</text>
<text x="878" y="418" font-size="12" fill="#5a6b78" text-anchor="middle">refunded in full &#183; SONG-E1</text>
<line x1="608" y1="405" x2="780" y2="405" stroke="#d6484a" stroke-width="1.5" marker-end="url(#fc-error)"/>
<line x1="878" y1="380" x2="510" y2="380" stroke="#6cc7e6" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#fc-retry)"/>
<text x="694" y="374" font-size="12" fill="#5a6b78" text-anchor="middle">Retry</text>
<rect x="412" y="470" width="196" height="50" rx="8" fill="#e3f7ea" stroke="#6cc79a" stroke-width="1.5"/>
<text x="510" y="490" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">/song/result</text>
<text x="510" y="508" font-size="12" fill="#5a6b78" text-anchor="middle">play, seek, publish &#183; SONG-P3</text>
<line x1="510" y1="430" x2="510" y2="470" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="522" y="444" font-size="12" fill="#5a6b78" text-anchor="start">done</text>
<line x1="40" y1="534" x2="980" y2="534" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="556" font-size="15" font-weight="700" fill="#0c1c22">What the result leads to</text>
<rect x="44" y="576" width="196" height="65" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="142" y="596" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Use in Music Video</text>
<text x="142" y="614" font-size="12" fill="#5a6b78" text-anchor="middle">pre-fills /mv/room &#183;</text>
<text x="142" y="629" font-size="12" fill="#5a6b78" text-anchor="middle">AC-SONG-07</text>
<rect x="412" y="576" width="196" height="50" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="510" y="596" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Recreate</text>
<text x="510" y="614" font-size="12" fill="#5a6b78" text-anchor="middle">same price as a first render</text>
<rect x="780" y="576" width="196" height="65" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="878" y="596" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Publish</text>
<text x="878" y="614" font-size="12" fill="#5a6b78" text-anchor="middle">instant, no confirm &#183;</text>
<text x="878" y="629" font-size="12" fill="#5a6b78" text-anchor="middle">SONG-P3-S4</text>
<line x1="412" y1="495" x2="142" y2="576" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<line x1="510" y1="520" x2="510" y2="576" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<line x1="608" y1="495" x2="878" y2="576" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<path d="M412 601 L382 601 L382 405 L412 405" fill="none" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="44" y="672" font-size="12" fill="#5a6b78">Lyrics only exist if the user wrote them: a Simple-mode song has none, and the Lyrics control is then not rendered at all (AC-SONG-06).</text>
<text x="44" y="690" font-size="12" fill="#5a6b78">A user MAY like their own song &#8212; decided 2026-08-19, TBD-SONG-08.</text>
<line x1="40" y1="716" x2="980" y2="716" stroke="#e5e9ed" stroke-width="1"/>
<line x1="40" y1="736" x2="74" y2="736" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="86" y="740" font-size="12" fill="#5a6b78">Primary happy path</text>
<line x1="40" y1="756" x2="74" y2="756" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<text x="86" y="760" font-size="12" fill="#5a6b78">Structural navigation (entry, exit, close)</text>
<line x1="40" y1="776" x2="74" y2="776" stroke="#d6484a" stroke-width="1.5" marker-end="url(#fc-error)"/>
<text x="86" y="780" font-size="12" fill="#5a6b78">Error branch</text>
<line x1="40" y1="796" x2="74" y2="796" stroke="#6cc7e6" stroke-width="1.5" stroke-dasharray="2 3" marker-end="url(#fc-retry)"/>
<text x="86" y="800" font-size="12" fill="#5a6b78">Retry loop</text>
<line x1="40" y1="816" x2="74" y2="816" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="86" y="820" font-size="12" fill="#5a6b78">Deferred / reused elsewhere</text>
</g>
</svg>
