<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1084" viewBox="0 0 1080 1084" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" role="img">
<title>1. Navigation &amp; Sign-in &#8212; User Flowchart</title>
<desc>How a visitor moves around the site and where signing in is required.</desc>
<defs><marker id="fc-primary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#5a6b78" stroke-width="1.5"/></marker><marker id="fc-error" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#d6484a" stroke-width="1.5"/></marker><marker id="fc-structural" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#a8b2ba" stroke-width="1.5"/></marker><marker id="fc-deferred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#a8b2ba" stroke-width="1.5"/></marker><marker id="fc-retry" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#6cc7e6" stroke-width="1.5"/></marker></defs>
<rect width="1080" height="1084" fill="#ffffff"/>
<text x="40" y="30" font-size="17" font-weight="700" fill="#0c1c22">1. Navigation &amp; Sign-in &#8212; User Flowchart</text>
<text x="40" y="50" font-size="13" fill="#5a6b78">YouCam Muse Web (desktop 1440 / phone 375) &#183; matches spec V1, 2026-08-19</text>
<text x="40" y="70" font-size="12" fill="#5a6b78">blue = system response &#183; amber = decision &#183; green = success / resolved &#183; red = error state</text>

<g transform="translate(0,80)">
<line x1="40" y1="2" x2="1040" y2="2" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="24" font-size="15" font-weight="700" fill="#0c1c22">Entry</text>
<rect x="445" y="44" width="190" height="50" rx="20" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5"/>
<text x="540" y="64" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Visitor arrives</text>
<text x="540" y="82" font-size="12" fill="#5a6b78" text-anchor="middle">any route</text>
<rect x="445" y="128" width="190" height="65" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="540" y="148" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">App shell</text>
<text x="540" y="166" font-size="12" fill="#5a6b78" text-anchor="middle">Sidebar &gt;=768px / tab bar</text>
<text x="540" y="181" font-size="12" fill="#5a6b78" text-anchor="middle">&lt;768px &#183; AC-SHELL-01</text>
<line x1="540" y1="94" x2="540" y2="128" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<rect x="830" y="128" width="190" height="50" rx="8" fill="#e0f7fd" stroke="#6cc7e6" stroke-width="1.5"/>
<text x="925" y="148" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">/share (bare page)</text>
<text x="925" y="166" font-size="12" fill="#5a6b78" text-anchor="middle">no shell, public &#183; AC-SHELL-07</text>
<line x1="635" y1="69" x2="830" y2="153" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<text x="732.5" y="105" font-size="12" fill="#5a6b78" text-anchor="middle">share link</text>
<line x1="40" y1="210" x2="1040" y2="210" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="232" font-size="15" font-weight="700" fill="#0c1c22">Where the user can go</text>
<rect x="60" y="252" width="190" height="50" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="155" y="272" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">/ Landing</text>
<text x="155" y="290" font-size="12" fill="#5a6b78" text-anchor="middle">hero + 3 rails &#183; AC-EXP-01</text>
<rect x="445" y="252" width="190" height="50" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="540" y="272" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Create</text>
<text x="540" y="290" font-size="12" fill="#5a6b78" text-anchor="middle">/mv/room &#183; /song/create</text>
<rect x="830" y="252" width="190" height="50" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="925" y="272" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">My stuff</text>
<text x="925" y="290" font-size="12" fill="#5a6b78" text-anchor="middle">/history /profile /settings</text>
<line x1="445" y1="160.5" x2="155" y2="252" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<line x1="540" y1="193" x2="540" y2="252" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<line x1="635" y1="160.5" x2="925" y2="252" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<line x1="40" y1="338" x2="1040" y2="338" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="360" font-size="15" font-weight="700" fill="#0c1c22">The login gate &#8212; two layers, and they behave differently</text>
<polygon points="540,368 632,400 540,432 448,400" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="540" y="398" font-size="13" font-weight="700" fill="#0c1c22" text-anchor="middle">Signed in?</text>
<text x="540" y="415" font-size="11" fill="#5a6b78" text-anchor="middle">GL-02</text>
<line x1="540" y1="302" x2="540" y2="368" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<rect x="60" y="452" width="190" height="65" rx="8" fill="#e3f7ea" stroke="#6cc79a" stroke-width="1.5"/>
<text x="155" y="472" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Guests SEE the page</text>
<text x="155" y="490" font-size="12" fill="#5a6b78" text-anchor="middle">/mv/room, /song/create &#183;</text>
<text x="155" y="505" font-size="12" fill="#5a6b78" text-anchor="middle">AC-AUTH-08</text>
<line x1="448" y1="400" x2="155" y2="452" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="301.5" y="420" font-size="12" fill="#5a6b78" text-anchor="middle">no</text>
<rect x="830" y="452" width="190" height="65" rx="8" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="925" y="472" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Guarded routes</text>
<text x="925" y="490" font-size="12" fill="#5a6b78" text-anchor="middle">history/profile/settings/credits &#183;</text>
<text x="925" y="505" font-size="12" fill="#5a6b78" text-anchor="middle">AC-AUTH-01</text>
<line x1="925" y1="302" x2="925" y2="452" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<rect x="445" y="556" width="190" height="65" rx="8" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="540" y="576" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Sign-in modal</text>
<text x="540" y="594" font-size="12" fill="#5a6b78" text-anchor="middle">Apple / Google, 1.8s mock &#183;</text>
<text x="540" y="609" font-size="12" fill="#5a6b78" text-anchor="middle">AC-AUTH-02</text>
<line x1="155" y1="517" x2="445" y2="588.5" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="300" y="546.75" font-size="12" fill="#5a6b78" text-anchor="middle">taps Create</text>
<line x1="925" y1="517" x2="635" y2="588.5" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="780" y="546.75" font-size="12" fill="#5a6b78" text-anchor="middle">on arrival</text>
<polygon points="540,632 638.989,664 540,696 441.011,664" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="540" y="669" font-size="13" font-weight="700" fill="#0c1c22" text-anchor="middle">Completed?</text>
<line x1="540" y1="621" x2="540" y2="632" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<rect x="60" y="716" width="190" height="65" rx="8" fill="#e3f7ea" stroke="#6cc79a" stroke-width="1.5"/>
<text x="155" y="736" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Queued action runs</text>
<text x="155" y="754" font-size="12" fill="#5a6b78" text-anchor="middle">the thing they clicked &#183;</text>
<text x="155" y="769" font-size="12" fill="#5a6b78" text-anchor="middle">AC-AUTH-02</text>
<line x1="441.011" y1="664" x2="155" y2="716" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="298.006" y="684" font-size="12" fill="#5a6b78" text-anchor="middle">yes</text>
<rect x="830" y="716" width="190" height="65" rx="8" fill="#fdecec" stroke="#e08a8a" stroke-width="1.5"/>
<text x="925" y="736" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Dismissed</text>
<text x="925" y="754" font-size="12" fill="#5a6b78" text-anchor="middle">from a guard -&gt; Home; from</text>
<text x="925" y="769" font-size="12" fill="#5a6b78" text-anchor="middle">nav -&gt; stay &#183; AC-AUTH-03</text>
<line x1="638.989" y1="664" x2="925" y2="716" stroke="#d6484a" stroke-width="1.5" marker-end="url(#fc-error)"/>
<text x="781.994" y="684" font-size="12" fill="#5a6b78" text-anchor="middle">no</text>
<text x="60" y="812" font-size="12" fill="#5a6b78">The two layers are not the same rule: the four guarded routes open the modal on ARRIVAL, while the two create routes stay open to guests</text>
<text x="60" y="830" font-size="12" fill="#5a6b78">and gate at the ACTION. Reading only the route guards makes the create screens look unprotected &#8212; they are not.</text>
<line x1="40" y1="856" x2="1040" y2="856" stroke="#e5e9ed" stroke-width="1"/>
<line x1="40" y1="876" x2="74" y2="876" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="86" y="880" font-size="12" fill="#5a6b78">Primary happy path</text>
<line x1="40" y1="896" x2="74" y2="896" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<text x="86" y="900" font-size="12" fill="#5a6b78">Structural navigation (entry, exit, close)</text>
<line x1="40" y1="916" x2="74" y2="916" stroke="#d6484a" stroke-width="1.5" marker-end="url(#fc-error)"/>
<text x="86" y="920" font-size="12" fill="#5a6b78">Error branch</text>
<text x="40" y="944" font-size="12" fill="#5a6b78">Screen IDs in grey are the spec criteria that own each rule (specs/areas/01-app-shell.md, 09-auth-onboarding.md).</text>
</g>
</svg>
