<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1012" viewBox="0 0 1080 1012" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" role="img">
<title>6. History &amp; Managing Creations &#8212; User Flowchart</title>
<desc>Finding past work and the actions available on each kind of row.</desc>
<defs><marker id="fc-primary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#5a6b78" stroke-width="1.5"/></marker><marker id="fc-error" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#d6484a" stroke-width="1.5"/></marker><marker id="fc-structural" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#a8b2ba" stroke-width="1.5"/></marker><marker id="fc-deferred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#a8b2ba" stroke-width="1.5"/></marker><marker id="fc-retry" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#6cc7e6" stroke-width="1.5"/></marker></defs>
<rect width="1080" height="1012" fill="#ffffff"/>
<text x="40" y="30" font-size="17" font-weight="700" fill="#0c1c22">6. History &amp; Managing Creations &#8212; User Flowchart</text>
<text x="40" y="50" font-size="13" fill="#5a6b78">YouCam Muse Web (desktop 1440 / phone 375) &#183; matches spec V1, 2026-08-19</text>
<text x="40" y="70" font-size="12" fill="#5a6b78">blue = system response &#183; green = success / resolved &#183; red = error state &#183; amber = decision</text>

<g transform="translate(0,80)">
<line x1="40" y1="2" x2="1040" y2="2" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="24" font-size="15" font-weight="700" fill="#0c1c22">Entry</text>
<rect x="442" y="44" width="196" height="50" rx="20" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5"/>
<text x="540" y="64" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">/history</text>
<text x="540" y="82" font-size="12" fill="#5a6b78" text-anchor="middle">signed-in only &#183; AC-AUTH-01</text>
<rect x="442" y="124" width="196" height="65" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="540" y="144" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Filter tabs</text>
<text x="540" y="162" font-size="12" fill="#5a6b78" text-anchor="middle">All / MV / Songs / Liked &#183;</text>
<text x="540" y="177" font-size="12" fill="#5a6b78" text-anchor="middle">AC-HIST-02</text>
<line x1="540" y1="94" x2="540" y2="124" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<line x1="40" y1="188" x2="1040" y2="188" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="210" font-size="15" font-weight="700" fill="#0c1c22">A row's state decides what it offers</text>
<rect x="44" y="230" width="196" height="65" rx="8" fill="#e0f7fd" stroke="#6cc7e6" stroke-width="1.5"/>
<text x="142" y="250" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Generating</text>
<text x="142" y="268" font-size="12" fill="#5a6b78" text-anchor="middle">not clickable, no menu &#183;</text>
<text x="142" y="283" font-size="12" fill="#5a6b78" text-anchor="middle">HIST-E1</text>
<rect x="442" y="230" width="196" height="50" rx="8" fill="#e3f7ea" stroke="#6cc79a" stroke-width="1.5"/>
<text x="540" y="250" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Done</text>
<text x="540" y="268" font-size="12" fill="#5a6b78" text-anchor="middle">opens its result screen</text>
<rect x="830" y="230" width="196" height="50" rx="8" fill="#fdecec" stroke="#e08a8a" stroke-width="1.5"/>
<text x="928" y="250" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Failed</text>
<text x="928" y="268" font-size="12" fill="#5a6b78" text-anchor="middle">menu is Delete only &#183; HIST-E2</text>
<line x1="442" y1="156.5" x2="142" y2="230" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<line x1="540" y1="189" x2="540" y2="230" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<line x1="638" y1="156.5" x2="928" y2="230" stroke="#d6484a" stroke-width="1.5" marker-end="url(#fc-error)"/>
<rect x="44" y="330" width="196" height="50" rx="8" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="142" y="350" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Storyboard</text>
<text x="142" y="368" font-size="12" fill="#5a6b78" text-anchor="middle">Create MV pill &#183; HIST-05</text>
<rect x="830" y="330" width="196" height="50" rx="8" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="928" y="350" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Community (Liked)</text>
<text x="928" y="368" font-size="12" fill="#5a6b78" text-anchor="middle">Like / Share only &#183; HIST-E3</text>
<line x1="442" y1="156.5" x2="44" y2="355" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<line x1="638" y1="156.5" x2="1026" y2="355" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<line x1="40" y1="398" x2="1040" y2="398" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="420" font-size="15" font-weight="700" fill="#0c1c22">Actions on a finished creation  &#183;  all four hang off the row menu</text>
<rect x="44" y="442" width="196" height="65" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="142" y="462" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Open</text>
<text x="142" y="480" font-size="12" fill="#5a6b78" text-anchor="middle">/mv/result or /song/result &#183;</text>
<text x="142" y="495" font-size="12" fill="#5a6b78" text-anchor="middle">AC-HIST-04</text>
<rect x="296" y="442" width="196" height="50" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="394" y="462" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Edit MV</text>
<text x="394" y="480" font-size="12" fill="#5a6b78" text-anchor="middle">seeds the flow &#183; AC-HIST-07</text>
<rect x="548" y="442" width="196" height="50" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="646" y="462" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Download</text>
<text x="646" y="480" font-size="12" fill="#5a6b78" text-anchor="middle">fixture media &#183; AC-HIST-08</text>
<rect x="800" y="442" width="196" height="50" rx="8" fill="#fdecec" stroke="#e08a8a" stroke-width="1.5"/>
<text x="898" y="462" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Delete</text>
<text x="898" y="480" font-size="12" fill="#5a6b78" text-anchor="middle">confirm first &#183; AC-HIST-06</text>
<line x1="540" y1="280" x2="142" y2="442" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<line x1="540" y1="280" x2="394" y2="442" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<line x1="540" y1="280" x2="646" y2="442" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<line x1="540" y1="280" x2="898" y2="442" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<line x1="40" y1="534" x2="1040" y2="534" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="556" font-size="15" font-weight="700" fill="#0c1c22">Publishing  &#183;  the one place MV and Song differ</text>
<rect x="44" y="578" width="196" height="65" rx="8" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="142" y="598" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Publish an MV</text>
<text x="142" y="616" font-size="12" fill="#5a6b78" text-anchor="middle">confirm dialog first &#183;</text>
<text x="142" y="631" font-size="12" fill="#5a6b78" text-anchor="middle">AC-HIST-05</text>
<rect x="830" y="578" width="196" height="50" rx="8" fill="#e3f7ea" stroke="#6cc79a" stroke-width="1.5"/>
<text x="928" y="598" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Publish a song</text>
<text x="928" y="616" font-size="12" fill="#5a6b78" text-anchor="middle">instant, no confirm</text>
<line x1="394" y1="492" x2="142" y2="578" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<line x1="646" y1="492" x2="928" y2="578" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<rect x="44" y="668" width="196" height="50" rx="8" fill="#e0f7fd" stroke="#6cc7e6" stroke-width="1.5"/>
<text x="142" y="688" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">In review</text>
<text x="142" y="706" font-size="12" fill="#5a6b78" text-anchor="middle">then published &#183; TBD-HIST-04</text>
<line x1="142" y1="643" x2="142" y2="668" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="154" y="649.5" font-size="12" fill="#5a6b78" text-anchor="start">Confirm</text>
<rect x="442" y="668" width="196" height="65" rx="8" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="540" y="688" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Now locked</text>
<text x="540" y="706" font-size="12" fill="#5a6b78" text-anchor="middle">unpublish before editing; Delete</text>
<text x="540" y="721" font-size="12" fill="#5a6b78" text-anchor="middle">hidden &#183; MV-E7</text>
<line x1="240" y1="693" x2="442" y2="700.5" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<line x1="928" y1="628" x2="638" y2="700.5" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<text x="44" y="760" font-size="12" fill="#5a6b78">History is in memory: a reload drops live jobs and leaves only the seeded samples (HIST-E4). Persistence is TBD-GL-04, for RD.</text>
<text x="44" y="778" font-size="12" fill="#5a6b78">Publishing is a front-end state only &#8212; no moderation pipeline exists yet (TBD-HIST-04). It is easy to mistake for a finished feature.</text>
<line x1="40" y1="808" x2="1040" y2="808" stroke="#e5e9ed" stroke-width="1"/>
<line x1="40" y1="828" x2="74" y2="828" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="86" y="832" font-size="12" fill="#5a6b78">Primary happy path</text>
<line x1="40" y1="848" x2="74" y2="848" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<text x="86" y="852" font-size="12" fill="#5a6b78">Structural navigation (entry, exit, close)</text>
<line x1="40" y1="868" x2="74" y2="868" stroke="#d6484a" stroke-width="1.5" marker-end="url(#fc-error)"/>
<text x="86" y="872" font-size="12" fill="#5a6b78">Error branch</text>
</g>
</svg>
