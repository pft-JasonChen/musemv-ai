<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1212" viewBox="0 0 1000 1212" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" role="img">
<title>5. Credits &amp; Purchases &#8212; User Flowchart</title>
<desc>Where credits come from, what spends them, and the subscriber-only rule.</desc>
<defs><marker id="fc-primary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#5a6b78" stroke-width="1.5"/></marker><marker id="fc-error" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#d6484a" stroke-width="1.5"/></marker><marker id="fc-structural" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#a8b2ba" stroke-width="1.5"/></marker><marker id="fc-deferred" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#a8b2ba" stroke-width="1.5"/></marker><marker id="fc-retry" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#6cc7e6" stroke-width="1.5"/></marker></defs>
<rect width="1000" height="1212" fill="#ffffff"/>
<text x="40" y="30" font-size="17" font-weight="700" fill="#0c1c22">5. Credits &amp; Purchases &#8212; User Flowchart</text>
<text x="40" y="50" font-size="13" fill="#5a6b78">YouCam Muse Web (desktop 1440 / phone 375) &#183; matches spec V1, 2026-08-19</text>
<text x="40" y="70" font-size="12" fill="#5a6b78">amber = decision &#183; green = success / resolved &#183; blue = system response &#183; red = error state</text>

<g transform="translate(0,80)">
<line x1="40" y1="2" x2="960" y2="2" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="24" font-size="15" font-weight="700" fill="#0c1c22">Balance</text>
<rect x="402" y="44" width="196" height="50" rx="20" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5"/>
<text x="500" y="64" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">New free account</text>
<text x="500" y="82" font-size="12" fill="#5a6b78" text-anchor="middle">10 credits &#183; TBD-CR-06a</text>
<polygon points="500,108 598.21,140 500,172 401.79,140" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="500" y="138" font-size="13" font-weight="700" fill="#0c1c22" text-anchor="middle">Subscriber?</text>
<text x="500" y="155" font-size="11" fill="#5a6b78" text-anchor="middle">CR-06</text>
<line x1="500" y1="94" x2="500" y2="108" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<rect x="44" y="200" width="196" height="50" rx="8" fill="#f4f6f8" stroke="#c0ccd3" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="142" y="220" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Free user</text>
<text x="142" y="238" font-size="12" fill="#5a6b78" text-anchor="middle">sees Upgrade only &#183; AC-CR-08</text>
<rect x="760" y="200" width="196" height="50" rx="8" fill="#e3f7ea" stroke="#6cc79a" stroke-width="1.5"/>
<text x="858" y="220" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Muse Pro</text>
<text x="858" y="238" font-size="12" fill="#5a6b78" text-anchor="middle">can buy credit packs</text>
<line x1="401.79" y1="140" x2="142" y2="200" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="271.895" y="164" font-size="12" fill="#5a6b78" text-anchor="middle">no</text>
<line x1="598.21" y1="140" x2="858" y2="200" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="728.105" y="164" font-size="12" fill="#5a6b78" text-anchor="middle">yes</text>
<line x1="40" y1="278" x2="960" y2="278" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="300" font-size="15" font-weight="700" fill="#0c1c22">Getting more</text>
<rect x="44" y="322" width="196" height="65" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="142" y="342" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Subscribe</text>
<text x="142" y="360" font-size="12" fill="#5a6b78" text-anchor="middle">3 plans, no preselection &#183;</text>
<text x="142" y="375" font-size="12" fill="#5a6b78" text-anchor="middle">CR-P2-S1</text>
<rect x="760" y="420" width="196" height="65" rx="8" fill="#ffffff" stroke="#cfd8de" stroke-width="1.5"/>
<text x="858" y="440" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Buy credits</text>
<text x="858" y="458" font-size="12" fill="#5a6b78" text-anchor="middle">6 packs, 2000 preselected &#183;</text>
<text x="858" y="473" font-size="12" fill="#5a6b78" text-anchor="middle">CR-P1-S1</text>
<line x1="142" y1="250" x2="142" y2="322" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<line x1="858" y1="250" x2="858" y2="420" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<path d="M240 354.5 L786 354.5 L786 225 L760 225" fill="none" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<text x="794" y="289.75" font-size="11" fill="#5a6b78" text-anchor="start">becomes Pro</text>
<text x="44" y="512" font-size="12" fill="#5a6b78">A free user who taps Buy Credits gets the Subscribe dialog instead &#8212; credit packs are subscriber-only (CR-06, restored 2026-08-12).</text>
<line x1="40" y1="546" x2="960" y2="546" stroke="#e5e9ed" stroke-width="1"/>
<text x="40" y="568" font-size="15" font-weight="700" fill="#0c1c22">Spending  &#183;  charged when the job STARTS, refunded if it fails</text>
<rect x="402" y="590" width="196" height="50" rx="8" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="500" y="610" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Start a job</text>
<text x="500" y="628" font-size="12" fill="#5a6b78" text-anchor="middle">spec 11 computes the price</text>
<polygon points="500,668 624.514,700 500,732 375.486,700" fill="#fdf1df" stroke="#e0a24a" stroke-width="1.5"/>
<text x="500" y="698" font-size="13" font-weight="700" fill="#0c1c22" text-anchor="middle">Enough credits?</text>
<text x="500" y="715" font-size="11" fill="#5a6b78" text-anchor="middle">GL-01</text>
<line x1="500" y1="640" x2="500" y2="668" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<rect x="44" y="762" width="196" height="50" rx="8" fill="#e0f7fd" stroke="#6cc7e6" stroke-width="1.5"/>
<text x="142" y="782" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Charged, job runs</text>
<text x="142" y="800" font-size="12" fill="#5a6b78" text-anchor="middle">5.1</text>
<rect x="760" y="762" width="196" height="50" rx="8" fill="#fdecec" stroke="#e08a8a" stroke-width="1.5"/>
<text x="858" y="782" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Routed to purchase</text>
<text x="858" y="800" font-size="12" fill="#5a6b78" text-anchor="middle">no job starts &#183; AC-CR-07</text>
<line x1="375.486" y1="700" x2="142" y2="762" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="258.743" y="725" font-size="12" fill="#5a6b78" text-anchor="middle">yes</text>
<line x1="624.514" y1="700" x2="858" y2="762" stroke="#d6484a" stroke-width="1.5" marker-end="url(#fc-error)"/>
<text x="741.257" y="725" font-size="12" fill="#5a6b78" text-anchor="middle">no</text>
<path d="M956 787 L986 787 L986 452.5 L956 452.5" fill="none" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="994" y="619.75" font-size="11" fill="#5a6b78" text-anchor="start">buy, then retry</text>
<rect x="44" y="852" width="196" height="50" rx="8" fill="#e3f7ea" stroke="#6cc79a" stroke-width="1.5"/>
<text x="142" y="872" font-size="14" font-weight="700" fill="#0c1c22" text-anchor="middle">Failed -&gt; full refund</text>
<text x="142" y="890" font-size="12" fill="#5a6b78" text-anchor="middle">5.2</text>
<line x1="142" y1="812" x2="142" y2="852" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="44" y="940" font-size="12" fill="#5a6b78">Prices are never flat: an MV costs 45 (or 35 from a storyboard) plus a per-second rate set by MV type and resolution; a storyboard is tiered by song</text>
<text x="44" y="958" font-size="12" fill="#5a6b78">length; a shot recreate is 8 plus a per-second rate for that shot's kind; Merge is a flat 10. AI Enhance is always free.</text>
<line x1="40" y1="988" x2="960" y2="988" stroke="#e5e9ed" stroke-width="1"/>
<line x1="40" y1="1008" x2="74" y2="1008" stroke="#5a6b78" stroke-width="1.8" marker-end="url(#fc-primary)"/>
<text x="86" y="1012" font-size="12" fill="#5a6b78">Primary happy path</text>
<line x1="40" y1="1028" x2="74" y2="1028" stroke="#a8b2ba" stroke-width="1.5" marker-end="url(#fc-structural)"/>
<text x="86" y="1032" font-size="12" fill="#5a6b78">Structural navigation (entry, exit, close)</text>
<line x1="40" y1="1048" x2="74" y2="1048" stroke="#d6484a" stroke-width="1.5" marker-end="url(#fc-error)"/>
<text x="86" y="1052" font-size="12" fill="#5a6b78">Error branch</text>
<line x1="40" y1="1068" x2="74" y2="1068" stroke="#a8b2ba" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#fc-deferred)"/>
<text x="86" y="1072" font-size="12" fill="#5a6b78">Deferred / reused elsewhere</text>
</g>
</svg>
